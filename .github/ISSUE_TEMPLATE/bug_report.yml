name: Bug report
description: Report a reproducible problem in Modus
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Search [existing issues](https://github.com/Stoltembergg/modus/issues) first. Never include API keys, tokens, private source code, or other sensitive project data.
  - type: input
    id: version
    attributes:
      label: Modus version
      description: Find this in the app's About/settings view or the release you installed.
      placeholder: 0.1.2
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the exact error text if available.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Select...
        3. See...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact credentials, private paths, and project data before posting.
    validations:
      required: false
