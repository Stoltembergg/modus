name: actions-queue-triage-cancel

on:
  push:
    branches: [cursor/actions-queue-triage-7db8]
    paths:
      - ".github/workflows/actions-queue-triage-cancel.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel-queued-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cancel #116 Package macOS only (protect #113)
        uses: actions/github-script@v7
        with:
          script: |
            // #113 still needs Package runners for recovery. Cancel #116 Package macOS only.
            const never = new Set([]); // protect #113 by omission — do not list any #113 runs
            const runIds = [36851855211];
            const results = [];
            for (const run_id of runIds) {
              try {
                const { data: run } = await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id
                });
                // Safety: refuse to cancel if PR list includes 113
                const prNums = (run.pull_requests || []).map(p => p.number);
                if (prNums.includes(113) || (run.head_branch || '').includes('group-execution-linking')) {
                  results.push({ run_id, status: 'skipped_protect_113', prNums, branch: run.head_branch });
                  continue;
                }
                if (run.status === 'completed') {
                  results.push({ run_id, status: 'already_completed', conclusion: run.conclusion, name: run.name });
                  continue;
                }
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id
                });
                results.push({ run_id, status: 'canceled', previous: run.status, name: run.name, head_sha: run.head_sha });
                core.info(`canceled ${run_id}`);
              } catch (e) {
                results.push({ run_id, status: 'error', message: e.message });
              }
            }
            await core.summary.addHeading('Cancel #116 Package only').addCodeBlock(JSON.stringify(results, null, 2), 'json').write();
            console.log(JSON.stringify(results, null, 2));
