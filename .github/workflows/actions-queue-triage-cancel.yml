name: actions-queue-triage-cancel

on:
  push:
    branches: [cursor/actions-queue-triage-7db8]
    paths:
      - ".github/workflows/actions-queue-triage-cancel.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel-queued-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Re-cancel leftover Package macOS blocking #109 x64
        uses: actions/github-script@v7
        with:
          script: |
            // Free macOS x64 for #109 tip a9ae746 run 36847793892. Never cancel #109.
            const never = new Set([36847793892]);
            const runIds = [
              36847945213, 36847128358,
            ];
            const results = [];
            for (const run_id of runIds) {
              if (never.has(run_id)) {
                results.push({ run_id, status: 'skipped_never_109' });
                continue;
              }
              try {
                const { data: run } = await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id
                });
                if (run.status === 'completed') {
                  results.push({ run_id, status: 'already_completed', conclusion: run.conclusion, name: run.name });
                  continue;
                }
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id
                });
                results.push({ run_id, status: 'canceled', previous: run.status, name: run.name, head_sha: run.head_sha, branch: run.head_branch });
                core.info(`canceled ${run_id}`);
              } catch (e) {
                results.push({ run_id, status: 'error', message: e.message });
                core.warning(`fail ${run_id}: ${e.message}`);
              }
            }
            await core.summary.addHeading('#109 x64 free pass').addCodeBlock(JSON.stringify(results, null, 2), 'json').write();
            console.log(JSON.stringify(results, null, 2));
