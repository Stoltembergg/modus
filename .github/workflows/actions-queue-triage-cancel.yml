name: actions-queue-triage-cancel

on:
  push:
    branches: [cursor/actions-queue-triage-7db8]
    paths:
      - ".github/workflows/actions-queue-triage-cancel.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale-113:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Cancel all non-tip #113 Actions (keep tip 79c27b13344f)
        uses: actions/github-script@v7
        with:
          script: |
            const tip = "79c27b13344fd36a4002fa1c7a0c602c5be3b164";
            const branch = "cursor/group-execution-linking-c747";
            const never = new Set([36853358104, 36853358141, 36853358146]);
            const results = [];
            let canceled = 0;
            let kept = 0;
            let page = 1;
            const active = [];
            while (page <= 10) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch,
                per_page: 100,
                page
              });
              if (!data.workflow_runs.length) break;
              for (const run of data.workflow_runs) {
                if (["queued", "in_progress", "waiting", "requested", "pending"].includes(run.status)) {
                  active.push(run);
                }
              }
              if (data.workflow_runs.length < 100) break;
              page++;
            }
            for (const run of active) {
              const run_id = run.id;
              try {
                if (never.has(run_id) || run.head_sha === tip) {
                  kept++;
                  results.push({ run_id, status: "kept_tip", name: run.name, head_sha: run.head_sha, run_status: run.status });
                  continue;
                }
                // Same as: gh api -X POST repos/.../actions/runs/{id}/cancel
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id
                });
                canceled++;
                results.push({ run_id, status: "canceled", previous: run.status, name: run.name, head_sha: run.head_sha });
                core.info(`canceled ${run_id} ${run.name} ${run.head_sha}`);
              } catch (e) {
                results.push({ run_id, status: "error", message: e.message, name: run.name, head_sha: run.head_sha });
              }
            }
            await core.summary
              .addHeading(`#113 triage tip ${tip.slice(0,12)}`)
              .addRaw(`Canceled: ${canceled}; kept tip: ${kept}; scanned active: ${active.length}`)
              .addCodeBlock(JSON.stringify(results, null, 2), "json")
              .write();
            console.log(JSON.stringify({ canceled, kept, scanned: active.length, results }, null, 2));
