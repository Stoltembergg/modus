name: actions-queue-triage-cancel

on:
  push:
    branches: [cursor/actions-queue-triage-7db8]
    paths:
      - ".github/workflows/actions-queue-triage-cancel.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel-nontip-macos-117:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cancel Package macOS only when head_sha != current #117 tip
        uses: actions/github-script@v7
        with:
          script: |
            // CRITICAL: never cancel Package macOS for current tip head_sha
            const tipSha = '5c555869539666fdea9638736a4fda7fde317253';
            const branch = 'cursor/group-conversation-minors-c747';
            const cancelled = [];
            const kept = [];
            const errors = [];

            for (let page = 1; page <= 10; page++) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch,
                per_page: 100,
                page,
              });
              if (!data.workflow_runs.length) break;
              for (const run of data.workflow_runs) {
                if (run.name !== 'Package macOS') continue;
                if (!['queued', 'in_progress', 'waiting', 'requested', 'pending'].includes(run.status)) continue;
                if (run.head_sha === tipSha) {
                  kept.push({ id: run.id, head_sha: run.head_sha, status: run.status });
                  core.info(`KEEP tip Package macOS ${run.id} @ ${run.head_sha}`);
                  continue;
                }
                try {
                  await github.rest.actions.cancelWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id,
                  });
                  cancelled.push({ id: run.id, head_sha: run.head_sha, previous: run.status });
                  core.info(`cancelled nontip ${run.id} @ ${run.head_sha}`);
                } catch (e) {
                  errors.push({ id: run.id, message: e.message, status: e.status });
                }
              }
              if (data.workflow_runs.length < 100) break;
            }

            await core.summary
              .addHeading(`#117 nontip Package macOS cancel; tip ${tipSha.slice(0,12)}`)
              .addRaw(`Cancelled: ${cancelled.length}; kept tip: ${kept.length}; errors: ${errors.length}`)
              .addCodeBlock(JSON.stringify({ tipSha, cancelled, kept, errors }, null, 2), 'json')
              .write();
            console.log(JSON.stringify({ tipSha, cancelled, kept, errors }, null, 2));
