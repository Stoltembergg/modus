name: actions-queue-triage-cancel

on:
  push:
    branches: [cursor/actions-queue-triage-7db8]
    paths:
      - ".github/workflows/actions-queue-triage-cancel.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel-queued-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cancel Package macOS competing with #111 arm64
        uses: actions/github-script@v7
        with:
          script: |
            // Free macOS arm64 for PR #111 job 110304318185 / run 36842393932 tip c4595c9.
            // Never cancel #111. Target OTHER Groups PRs #109,#113,#114,#115,#116 only.
            const never = new Set([36842393932]);
            // Cancel queued + in_progress Package macOS on competing PRs (macos-14 runners).
            const cancelEvenIfInProgress = new Set([
              36846292207, 36846291035, 36846260481, 36846245746, 36846185959, 36846069573,
              36845929347, 36845826710, 36845707923, 36845708110, 36845678242, 36845500025,
              36845490565, 36845425875, 36845418835, 36845401123, 36845401894, 36845358870,
              36845357423, 36845316582, 36845226767, 36845173083, 36845160671, 36845088930,
              36844913889, 36844837328, 36844814297, 36844299265, 36842743287,
            ]);
            const runIds = [
              36846292207, 36846291035, 36846260481, 36846245746, 36846185959, 36846069573,
              36845929347, 36845826710, 36845707923, 36845708110, 36845678242, 36845500025,
              36845490565, 36845425875, 36845418835, 36845401123, 36845401894, 36845358870,
              36845357423, 36845316582, 36845226767, 36845173083, 36845160671, 36845088930,
              36844913889, 36844837328, 36844814297, 36844299265, 36842743287,
            ];
            const results = [];
            for (const run_id of runIds) {
              if (never.has(run_id)) {
                results.push({ run_id, status: 'skipped_never_111' });
                continue;
              }
              try {
                const { data: run } = await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id
                });
                if (run.status === 'completed') {
                  results.push({ run_id, status: 'already_completed', conclusion: run.conclusion, name: run.name });
                  continue;
                }
                if (run.status === 'in_progress' && !cancelEvenIfInProgress.has(run_id)) {
                  results.push({ run_id, status: 'skipped_in_progress', name: run.name });
                  continue;
                }
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id
                });
                results.push({ run_id, status: 'canceled', previous: run.status, name: run.name, head_sha: run.head_sha, branch: run.head_branch });
                core.info(`canceled ${run_id} (${run.name}, was ${run.status})`);
              } catch (e) {
                results.push({ run_id, status: 'error', message: e.message });
                core.warning(`fail ${run_id}: ${e.message}`);
              }
            }
            await core.summary
              .addHeading('Actions queue triage cancel')
              .addCodeBlock(JSON.stringify(results, null, 2), 'json')
              .write();
            console.log(JSON.stringify(results, null, 2));
