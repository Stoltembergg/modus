name: actions-queue-triage-cancel

on:
  push:
    branches: [cursor/actions-queue-triage-7db8]
    paths:
      - ".github/workflows/actions-queue-triage-cancel.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel-queued-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cancel Package macOS competing with #111 arm64 (pass 3)
        uses: actions/github-script@v7
        with:
          script: |
            // Pass 3: newly queued after tip churn on #109/#113-116. Never touch #111.
            const never = new Set([36842393932]);
            const cancelEvenIfInProgress = new Set([
              36847737415, 36847722582, 36847706319, 36847689170, 36847568234,
            ]);
            const runIds = [
              36847737415, 36847722582, 36847706319, 36847689170, 36847568234,
            ];
            const results = [];
            for (const run_id of runIds) {
              if (never.has(run_id)) {
                results.push({ run_id, status: 'skipped_never_111' });
                continue;
              }
              try {
                const { data: run } = await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id
                });
                if (run.status === 'completed') {
                  results.push({ run_id, status: 'already_completed', conclusion: run.conclusion, name: run.name });
                  continue;
                }
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id
                });
                results.push({ run_id, status: 'canceled', previous: run.status, name: run.name, head_sha: run.head_sha });
                core.info(`canceled ${run_id}`);
              } catch (e) {
                results.push({ run_id, status: 'error', message: e.message });
              }
            }
            await core.summary.addHeading('pass 3').addCodeBlock(JSON.stringify(results, null, 2), 'json').write();
            console.log(JSON.stringify(results, null, 2));
