name: actions-queue-triage-cancel

on:
  push:
    branches: [cursor/actions-queue-triage-7db8]
    paths:
      - ".github/workflows/actions-queue-triage-cancel.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale-macos-117:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cancel non-tip Package macOS for #117 (keep tip)
        uses: actions/github-script@v7
        with:
          script: |
            const keepTip = '220b55489230b13818425179d91fab12bdfbb373';
            const keepLegacy = '31d8802fae51975b2c18d6d0ded875a66c6a0a81';
            const keepRuns = new Set([36864907236]); // prior clean Package macOS if still useful
            const explicit = [36864574769, 36864844857, 36864860165, 36865742244];
            const branch = 'cursor/group-conversation-minors-c747';
            const cancelled = [];
            const kept = [];
            const errors = [];

            async function cancelRun(id, reason) {
              if (keepRuns.has(id)) {
                kept.push({ id, reason: 'keep_run' });
                return;
              }
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: id,
                });
                cancelled.push({ id, reason });
                core.info(`cancelled ${id} (${reason})`);
              } catch (e) {
                errors.push({ id, reason, message: e.message, status: e.status });
                core.info(`skip ${id}: ${e.status || ''} ${e.message}`);
              }
            }

            for (const id of explicit) {
              await cancelRun(id, 'explicit');
            }

            for (let page = 1; page <= 10; page++) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch,
                per_page: 100,
                page,
              });
              if (!data.workflow_runs.length) break;
              for (const run of data.workflow_runs) {
                if (run.name !== 'Package macOS') continue;
                if (!['queued', 'in_progress', 'waiting', 'requested', 'pending'].includes(run.status)) continue;
                if (run.head_sha === keepTip || run.head_sha === keepLegacy || keepRuns.has(run.id)) {
                  kept.push({ id: run.id, head_sha: run.head_sha, status: run.status, reason: 'keep_tip' });
                  continue;
                }
                await cancelRun(run.id, `branch active head ${run.head_sha}`);
              }
              if (data.workflow_runs.length < 100) break;
            }

            await core.summary
              .addHeading('#117 Package macOS capacity cancel (helper branch)')
              .addRaw(`Cancelled: ${cancelled.length}; kept: ${kept.length}; errors: ${errors.length}`)
              .addCodeBlock(JSON.stringify({ cancelled, kept, errors }, null, 2), 'json')
              .write();
            console.log(JSON.stringify({ cancelled, kept, errors }, null, 2));
