name: apply-biome-format-117
on:
  push:
    branches: [cursor/group-conversation-minors-c747]
    paths:
      - 'internal/_push/biome117/READY'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply biome-formatted GroupMessageList/Row
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 <<'PY'
          import base64, hashlib, json, pathlib, zlib, subprocess, shutil
          root = pathlib.Path('internal/_push/biome117')
          manifest = json.loads((root / 'manifest.json').read_text())
          for entry in manifest['files']:
              raw = zlib.decompress(base64.b64decode(''.join((root / p).read_text().strip() for p in entry['parts'])))
              digest = hashlib.sha1(b'blob %d\0' % len(raw) + raw).hexdigest()
              assert digest == entry['blob'], (entry['target'], digest, entry['blob'])
              path = pathlib.Path(entry['target'])
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(raw)
              print('wrote', entry['target'], len(raw), digest)
          shutil.rmtree(root)
          wf = pathlib.Path('.github/workflows/apply-biome-format-117.yml')
          if wf.exists():
              wf.unlink()
          subprocess.check_call(['git', 'add', '-A'])
          st = subprocess.check_output(['git', 'status', '--porcelain'], text=True).strip()
          print('status', st)
          if not st:
              print('nothing to commit')
          else:
              subprocess.check_call(['git', 'commit', '-m', 'fix(groups): restore GroupMessageList/Row after $file stub wipe'])
              subprocess.check_call(['git', 'push', 'origin', 'HEAD'])
          PY
