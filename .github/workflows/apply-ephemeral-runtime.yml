name: apply-ephemeral-runtime

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/group-room-ephemeral-runtime-bbfe
    paths:
      - "internal/_push/ephemeral/TRIGGER"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: cursor/group-room-ephemeral-runtime-bbfe
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble zlib payloads from staged parts
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="internal/_push/ephemeral/manifest.json"
          if [[ ! -f "$MANIFEST" ]]; then
            echo "Missing $MANIFEST"
            exit 1
          fi
          python3 << 'PY'
          import base64, hashlib, json, pathlib, zlib
          root = pathlib.Path(".")
          manifest = json.loads((root / "internal/_push/ephemeral/manifest.json").read_text())
          for entry in manifest:
              path = entry["path"]
              expect_sha = entry["sha256"]
              expect_bytes = entry.get("bytes")
              out = root / path
              if out.exists() and hashlib.sha256(out.read_bytes()).hexdigest() == expect_sha:
                  print(f"SKIP {path} (already matches)")
                  continue
              parts = entry["parts"]
              b64 = "".join("".join((root / p).read_text().split()) for p in parts)
              raw = zlib.decompress(base64.b64decode(b64))
              if expect_bytes is not None and len(raw) != expect_bytes:
                  raise SystemExit(f"byte length mismatch for {path}: got {len(raw)} expected {expect_bytes}")
              got = hashlib.sha256(raw).hexdigest()
              if got != expect_sha:
                  raise SystemExit(f"sha256 mismatch for {path}: got {got} expected {expect_sha}")
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_bytes(raw)
              print(f"OK {path} ({len(raw)} bytes, sha256={got})")
          PY

      - name: Remove staging directory and trigger marker
        shell: bash
        run: |
          set -euo pipefail
          rm -rf internal/_push/ephemeral
          rmdir internal/_push 2>/dev/null || true
          rmdir internal 2>/dev/null || true
          true

      - name: Commit applied payloads
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "feat(groups): apply ephemeral runtime payloads"
          git push origin HEAD:cursor/group-room-ephemeral-runtime-bbfe
