name: apply-gmltest-restore
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/patches/gmltest-restore/**'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/group-conversation-minors-c747
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Decode and restore GroupRoom.test.tsx
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64, zlib, hashlib
          from pathlib import Path
          parts = sorted(Path('.github/patches/gmltest-restore').glob('p*.b64'))
          b64 = ''.join(p.read_text().strip() for p in parts)
          data = zlib.decompress(base64.b64decode(b64))
          target = Path('apps/desktop/src/renderer/src/features/groups/GroupRoom.test.tsx')
          target.write_bytes(data)
          h = hashlib.sha1(b'blob %d\0'%len(data)+data).hexdigest()
          print('wrote', len(data), 'blob', h)
          assert h == '32ef929f2b682940ce2ab0711b774f2456cbfd81', h
          PY
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/renderer/src/features/groups/GroupRoom.test.tsx
          git diff --cached --quiet && echo 'no change' && exit 0
          git commit -m "fix(groups): restore GroupRoom conversation-minors tests"
          git push
