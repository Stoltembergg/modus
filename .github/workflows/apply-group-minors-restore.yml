name: apply-group-minors-restore
on:
  push:
    branches: [cursor/group-conversation-minors-c747]
    paths:
      - 'internal/_push/group-minors/**'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble group conversation minors files
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, hashlib, json, pathlib, zlib
          root = pathlib.Path('internal/_push/group-minors')
          manifest = json.loads((root / 'manifest.json').read_text())
          if 'files' in manifest:
            entries = manifest['files']
          else:
            entries = [manifest]
          for entry in entries:
            if isinstance(entry.get('parts'), list) and entry['parts'] and isinstance(entry['parts'][0], str):
              part_names = entry['parts']
            else:
              n = int(entry['parts'])
              target_name = pathlib.Path(entry['target']).name
              part_names = [f'{target_name}.part{i:02d}.zlib.b64' for i in range(n)]
            parts = []
            for name in part_names:
              p = root / name
              assert p.exists(), p
              parts.append(p.read_text().strip())
            data = zlib.decompress(base64.b64decode(''.join(parts)))
            assert len(data) == entry['bytes'], (entry['target'], len(data), entry['bytes'])
            digest = hashlib.sha1(b'blob %d\0' % len(data) + data).hexdigest()
            assert digest == entry['blob'], (entry['target'], digest, entry['blob'])
            target = pathlib.Path(entry['target'])
            target.parent.mkdir(parents=True, exist_ok=True)
            target.write_bytes(data)
            print('wrote', target, 'bytes', len(data), 'sha', digest)
          PY
          rm -rf internal/_push/group-minors
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'nothing to commit'
            exit 0
          fi
          git commit -m 'feat(groups): wire conversation search, copy, days, draft, tokens'
          git push origin HEAD:${{ github.ref_name }}
