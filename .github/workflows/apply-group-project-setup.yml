name: Apply group project Setup staging

on:
  push:
    branches: [cursor/group-project-setup]
    paths:
      - "docs/_tmp/gps/**"
      - ".github/workflows/apply-group-project-setup.yml"
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/group-project-setup
          fetch-depth: 0
      - name: Assemble zlib staging into apps paths
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, hashlib, pathlib, zlib
          root = pathlib.Path("docs/_tmp/gps")
          manifest = (root / "MANIFEST.txt").read_text().strip().splitlines()
          for line in manifest:
              path, digest, size, parts = line.split("\t")
              stem = path.replace("/", "__")
              blob = "".join((root / f"{stem}.zlib.b64.{i:02d}").read_text() for i in range(int(parts)))
              data = zlib.decompress(base64.b64decode(blob))
              got = hashlib.sha1(data).hexdigest()
              if got != digest:
                  raise SystemExit(f"digest mismatch for {path}: {got} != {digest}")
              if len(data) != int(size):
                  raise SystemExit(f"size mismatch for {path}: {len(data)} != {size}")
              out = pathlib.Path(path)
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_bytes(data)
              print(f"wrote {path} ({len(data)}B {got})")
          PY
      - name: Remove staging + this workflow
        shell: bash
        run: |
          rm -rf docs/_tmp/gps
          rm -f .github/workflows/apply-group-project-setup.yml
          rmdir docs/_tmp 2>/dev/null || true
      - name: Commit applied files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gabriel"
          git config user.email "stoltembergg@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "feat(groups): apply staged project Setup sources"
          git push origin HEAD:cursor/group-project-setup
