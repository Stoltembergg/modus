name: apply-h0-runtime-test
on:
  workflow_dispatch:
  push:
    branches: [cursor/group-progress-final-card-c747]
    paths:
      - "_agent_push/group-runtime.test.ts.zlib.b64.7"
      - ".github/workflows/apply-h0-runtime-test.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/group-progress-final-card-c747
      - name: Assemble, decompress, verify
        run: |
          set -euo pipefail
          for i in 0 1 2 3 4 5 6 7; do
            test -f "_agent_push/group-runtime.test.ts.zlib.b64.$i"
          done
          python3 - <<'PY'
          import base64, zlib, pathlib, hashlib
          expected = {
            0: "1abfb6ace016384eb8eb0894790e4acb573baa4c1e2fa9d5e96db659d90f0140",
            1: "94948e6ee0bc35198999fa039da9cd44185b6142b31684d800159f938c253bdc",
            2: "ff8165e842e2d76e783881cad58c7fac779baa92294f61b5a980a77d7f0459da",
            3: "407be4bd84295a79b106d74c9757b5e2803122e1a34bb2ed5b89607a10941896",
            4: "8f3f3ff66474e91b9609b6c819dce799fee8b8c239181d68384e2dc6fc107585",
            5: "cdf17647167f09265f0511eff50172b8bce292a7ecd7d7bac74acf8fc516bd43",
            6: "a9bca0aefa02c545a6f5d4e819f06f0100e4479ec6eb98c1d0f9097c445ad67b",
            7: "08c55cfb054b4f6bece7807eb4d9f09fcf683b971f4a38d6a41ed74e1bdd90a9",
          }
          parts = []
          for i in range(8):
            p = pathlib.Path(f"_agent_push/group-runtime.test.ts.zlib.b64.{i}")
            raw = p.read_bytes()
            digest = hashlib.sha256(raw).hexdigest()
            assert digest == expected[i], (i, digest, expected[i])
            parts.append(raw)
          assembled = b"".join(parts)
          assert len(assembled) == 15876, len(assembled)
          assert hashlib.sha256(assembled).hexdigest().startswith("7761b424949757cf")
          data = zlib.decompress(base64.b64decode(assembled))
          path = pathlib.Path("apps/desktop/src/main/groups/group-runtime.test.ts")
          path.write_bytes(data)
          assert len(data) == 58947, len(data)
          assert hashlib.sha256(data).hexdigest() == "5f479aa80224b6c127fad0e6c9bb73effc4ac002bc5c5a12ec6d4534f337465e"
          assert b"final result card: Outcome / Validations" in data
          print("wrote", path, len(data), hashlib.sha1(b"blob %d\0" % len(data) + data).hexdigest())
          PY
          rm -f _agent_push/group-runtime.test.ts.zlib.b64.0
          rm -f _agent_push/group-runtime.test.ts.zlib.b64.1
          rm -f _agent_push/group-runtime.test.ts.zlib.b64.2
          rm -f _agent_push/group-runtime.test.ts.zlib.b64.3
          rm -f _agent_push/group-runtime.test.ts.zlib.b64.4
          rm -f _agent_push/group-runtime.test.ts.zlib.b64.5
          rm -f _agent_push/group-runtime.test.ts.zlib.b64.6
          rm -f _agent_push/group-runtime.test.ts.zlib.b64.7
          rm -f _agent_push/group-runtime.test.ts.zlib.b64
          rm -f _agent_push/file-ref-probe.txt _agent_push/file-uri-probe.txt _agent_push/json-ref-probe.txt _agent_push/path-param-probe.txt
          rm -f .github/workflows/apply-h0-runtime-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "test(groups): expect final-card line in coordinator snapshot"
          git push
