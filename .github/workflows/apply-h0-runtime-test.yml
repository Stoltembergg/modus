name: apply-h0-runtime-test
on:
  workflow_dispatch:
  push:
    branches: [cursor/group-progress-final-card-c747]
    paths:
      - "_agent_push/group-runtime.test.ts.zlib.b64"
      - ".github/workflows/apply-h0-runtime-test.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/group-progress-final-card-c747
      - name: Decompress and verify
        run: |
          set -euo pipefail
          SRC=_agent_push/group-runtime.test.ts.zlib.b64
          DST=apps/desktop/src/main/groups/group-runtime.test.ts
          test -f "$SRC"
          python3 - <<'PY'
          import base64, zlib, pathlib
          raw = pathlib.Path("_agent_push/group-runtime.test.ts.zlib.b64").read_text().strip()
          data = zlib.decompress(base64.b64decode(raw))
          path = pathlib.Path("apps/desktop/src/main/groups/group-runtime.test.ts")
          path.write_bytes(data)
          assert len(data) == 58947, len(data)
          assert b"final result card: Outcome / Validations" in data
          print("wrote", path, len(data))
          PY
          rm -f "$SRC"
          rm -f .github/workflows/apply-h0-runtime-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(groups): expect final-card line in coordinator snapshot"
          git push
