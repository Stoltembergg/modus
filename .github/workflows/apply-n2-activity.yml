name: apply-n2-activity
on:
  push:
    branches: [cursor/natural-groups-n2-activity-cb29]
    paths: [.github/workflows/apply-n2-activity.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/natural-groups-n2-activity-cb29
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply N2 Activity panel patch
        run: |
          set -euo pipefail
          git config user.name "Gabriel"
          git config user.email "stoltembergg@gmail.com"
          mkdir -p /tmp/n2
          SRC=https://raw.githubusercontent.com/Stoltembergg/modus/cursor/natural-groups-n2-activity-cb29/docs/_tmp
          for i in 00 01; do
            curl -fsSL "$SRC/n2p-${i}.b64" -o "/tmp/n2/n2p-${i}.b64"
          done
          cat /tmp/n2/n2p-00.b64 /tmp/n2/n2p-01.b64 | tr -d '\n' | base64 -d | gzip -dc > /tmp/n2.patch
          git apply /tmp/n2.patch
          git rm -f .github/workflows/apply-n2-activity.yml
          rm -f docs/_tmp/n2p-00.b64 docs/_tmp/n2p-01.b64
          git add -A
          git status --short
          git commit -m "feat(groups): Activity panel demotes tasks and coordinator chrome (N2)"
          git push origin HEAD:cursor/natural-groups-n2-activity-cb29
