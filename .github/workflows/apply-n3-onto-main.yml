name: apply-n3-onto-main
on:
  push:
    branches: [cursor/natural-groups-n3-onto-main-cb29]
    paths: [.github/workflows/apply-n3-onto-main.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/natural-groups-n3-onto-main-cb29
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply N3 threads onto main
        run: |
          set -euo pipefail
          git config user.name "Gabriel"
          git config user.email "stoltembergg@gmail.com"
          cat docs/_tmp/n3s-* | tr -d '\n' | base64 -d | gzip -dc > /tmp/n3om.diff
          git apply /tmp/n3om.diff
          git rm -f .github/workflows/apply-n3-onto-main.yml
          git rm -f docs/_tmp/n3s-* docs/_tmp/n3om-* || true
          git add -A
          git status --short
          git commit -m "$(cat <<'EOFMSG' | sed 's/^          //'
          feat(groups): thread replies wake peers; nest secondary discussions (N3)
          
          Reply wakes the replied-to author; agent directed messages wake the
          recipient. Nest thread replies in the room. Update chain cleanup for
          parent-author wake on threaded agent replies.
          EOFMSG
          )"
          git push origin HEAD:cursor/natural-groups-n3-onto-main-cb29
