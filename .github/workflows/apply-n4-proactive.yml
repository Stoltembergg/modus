name: apply-n4-proactive
on:
  push:
    branches: [cursor/natural-groups-n4-proactive-cb29]
    paths: [.github/workflows/apply-n4-proactive.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/natural-groups-n4-proactive-cb29
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply N4 proactive patch
        run: |
          set -euo pipefail
          git config user.name "Gabriel"
          git config user.email "stoltembergg@gmail.com"
          cat docs/_tmp/n4p-* | tr -d '\n' | base64 -d | gzip -dc > /tmp/n4.diff
          git apply /tmp/n4.diff
          git rm -f .github/workflows/apply-n4-proactive.yml
          git rm -f docs/_tmp/n4p-* || true
          git add -A
          git status --short
          git commit -m "$(cat <<'EOFMSG' | sed 's/^          //'
          feat(groups): proactive resume/review wakes + interrupt policy (N4)
          
          After silence, resume one owned open/in_progress task. After Agreed/Proposed,
          wake the owner's reviewer. Ready/Blocked interrupt the user without peer wakes.
          EOFMSG
          )"
          git push origin HEAD:cursor/natural-groups-n4-proactive-cb29
