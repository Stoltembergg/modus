name: apply-n5-agents-ui
on:
  push:
    branches: [cursor/natural-groups-n5-agents-ui-cb29]
    paths: [.github/workflows/apply-n5-agents-ui.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/natural-groups-n5-agents-ui-cb29
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply N5 agents chrome patch
        run: |
          set -euo pipefail
          git config user.name "Gabriel"
          git config user.email "stoltembergg@gmail.com"
          cat docs/_tmp/n5a-* | tr -d '\n' | base64 -d | gzip -dc > /tmp/n5.patch
          git apply /tmp/n5.patch
          git rm -f .github/workflows/apply-n5-agents-ui.yml
          git rm -f docs/_tmp/n5a-* || true
          git add -A
          git status --short
          git commit -m "$(cat <<'EOFMSG'
feat(groups): Agents panel, morphing edit, multi-shape avatars (N5)

Remove permanent agent lists from the sidebar and group room header.
Expose members through a single Agents popover with Lead/status/role,
explicit 1:1 chat, and Morphing Dialog edit. Expand avatar identity
with shapes, a larger contrast-safe palette, and face/shape/color
pickers with live preview.
EOFMSG
)"
          git push origin HEAD:cursor/natural-groups-n5-agents-ui-cb29
