name: apply-n5ci-fix
on:
  push:
    branches: [cursor/natural-groups-n5-agents-ui-cb29]
    paths: [.github/workflows/apply-n5ci-fix.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/natural-groups-n5-agents-ui-cb29
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply A2 migration test fix
        run: |
          set -euo pipefail
          git config user.name "Gabriel"
          git config user.email "stoltembergg@gmail.com"
          cat docs/_tmp/n5ci-* | tr -d '\n' | base64 -d | gzip -dc > /tmp/n5ci.patch
          git apply /tmp/n5ci.patch
          git rm -f .github/workflows/apply-n5ci-fix.yml
          git rm -f docs/_tmp/n5ci-* || true
          git add -A
          git status --short
          git commit -m "$(cat <<'EOFMSG' | sed 's/^          //'
          fix(groups): omit avatar_shape on A1-shaped A2 migration fixture
          
          A1 schema has no avatar_shape; N5 adds it during migrateDatabase.
          EOFMSG
          )"
          git push origin HEAD:cursor/natural-groups-n5-agents-ui-cb29
