name: apply-natural-groups-n0n1
on:
  push:
    branches: [cursor/natural-groups-presence-cb29]
    paths: [.github/workflows/apply-natural-groups-n0n1.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/natural-groups-presence-cb29
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply natural-groups N0/N1 patch
        run: |
          set -euo pipefail
          cat docs/_tmp/natural-patch-*.b64 | tr -d '\n' | base64 -d | gzip -dc > /tmp/natural.patch
          git apply /tmp/natural.patch
          git status --short
      - name: Commit and push
        run: |
          git config user.name "Gabriel"
          git config user.email "stoltembergg@gmail.com"
          git add -A
          git rm -f .github/workflows/apply-natural-groups-n0n1.yml
          rm -rf docs/_tmp
          git add -A
          git commit -m "feat(groups): natural presence + autonomous no-@ routing"
          git push origin HEAD:cursor/natural-groups-presence-cb29
