name: apply-natural-groups-rebase
on:
  push:
    branches: [cursor/natural-groups-presence-cb29]
    paths: [.github/workflows/apply-natural-groups-rebase.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/natural-groups-presence-cb29
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Rebase N0/N1 tree onto main
        run: |
          set -euo pipefail
          git config user.name "Gabriel"
          git config user.email "stoltembergg@gmail.com"
          mkdir -p /tmp/natural-rebase
          cp docs/_tmp/nr-*.b64 /tmp/natural-rebase/
          git fetch origin main
          # Wipe branch files, materialize main tip, then apply the rebased diff.
          git rm -rf .
          git checkout origin/main -- .
          cat /tmp/natural-rebase/nr-*.b64 | tr -d '\n' | base64 -d | gzip -dc > /tmp/natural.patch
          git apply /tmp/natural.patch
          rm -rf docs/_tmp
          git add -A
          git status --short
          git commit -m "feat(groups): natural presence + autonomous no-@ routing (rebased on main)"
          git push origin HEAD:cursor/natural-groups-presence-cb29
