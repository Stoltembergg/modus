name: apply-p0b-biome-fix
on:
  push:
    branches: [cursor/group-collab-p0b-cb29]
    paths: [.github/workflows/apply-p0b-biome-fix.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/group-collab-p0b-cb29
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Strip trailing blanks that fail biome format
        run: |
          python3 <<'PY'
          import re
          from pathlib import Path

          more = Path("apps/desktop/src/main/groups/group-runtime-more.test.ts")
          text = more.read_text()
          text2, n = re.subn(
              r'(\*/\n)\n+(describe\("dispose")',
              r"\1\n\2",
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit(f"group-runtime-more.test.ts: expected 1 replace, got {n}")
          more.write_text(text2.rstrip("\n") + "\n")

          runtime = Path("apps/desktop/src/main/groups/group-runtime.test.ts")
          rtext = runtime.read_text()
          runtime.write_text(rtext.rstrip("\n") + "\n")
          print("patched ok", more.stat().st_size, runtime.stat().st_size)
          PY
      - name: Commit fix and remove this workflow
        run: |
          git config user.name "Gabriel"
          git config user.email "stoltembergg@gmail.com"
          git rm -f .github/workflows/apply-p0b-biome-fix.yml
          git add apps/desktop/src/main/groups/group-runtime-more.test.ts apps/desktop/src/main/groups/group-runtime.test.ts
          git status
          git commit -m "fix(groups): biome format for P0b runtime tests"
          git push origin HEAD:cursor/group-collab-p0b-cb29
