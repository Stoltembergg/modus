name: apply-p0b-runtime
on:
  push:
    paths:
      - ".github/workflows/apply-p0b-runtime.yml"
      - ".github/agent-staging/p0b-runtime/**"
permissions:
  contents: write
concurrency:
  group: apply-p0b-runtime
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Materialize P0b runtime files
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, zlib, pathlib, hashlib
          staging = pathlib.Path(".github/agent-staging/p0b-runtime")
          expected = {
            "group-runtime.ts": "7378cf7843b125628559e7e7b0a5086e46a233f4",
            "group-runtime.test.ts": "b147dd5d14b26920a3830b1d67d150bd0e6638f7",
            "group-runtime-more.test.ts": "16cf3bd501ea56786acf141bbbb351e76909f876",
          }
          dest_root = pathlib.Path("apps/desktop/src/main/groups")
          for name, blob in expected.items():
              b64 = (staging / f"{name}.zlib.b64").read_text().strip()
              raw = zlib.decompress(base64.b64decode(b64))
              got = hashlib.sha1(b"blob %d\0" % len(raw) + raw).hexdigest()
              if got != blob:
                  raise SystemExit(f"blob mismatch {name}: {got} != {blob}")
              path = dest_root / name
              path.write_bytes(raw)
              print(f"wrote {path} bytes={len(raw)} blob={got}")
          PY
      - name: Commit runtime files and remove staging
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/main/groups/group-runtime.ts
          git diff --cached --quiet || git commit -m "refactor(groups): P0b slim group-runtime via lib"
          git add apps/desktop/src/main/groups/group-runtime.test.ts
          git diff --cached --quiet || git commit -m "test(groups): P0b split group-runtime tests"
          git add apps/desktop/src/main/groups/group-runtime-more.test.ts
          git diff --cached --quiet || git commit -m "test(groups): P0b add group-runtime-more tests"
          git rm -r --ignore-unmatch .github/agent-staging/p0b-runtime || true
          git rm --ignore-unmatch .github/workflows/apply-p0b-runtime.yml || true
          git diff --cached --quiet || git commit -m "chore: remove P0b runtime staging workflow"
          git push origin "HEAD:${GITHUB_REF_NAME}"
