name: apply-p1a-panel
on:
  push:
    branches: [cursor/group-tasks-spring-p1a-cb29]
    paths: [.github/workflows/apply-p1a-panel.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/group-tasks-spring-p1a-cb29
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply GroupRoom.test patch from staged replacement
        run: |
          python3 <<'PY'
          import base64, zlib, pathlib
          repl_path = pathlib.Path(".github/agent-staging/p1a-panel/task-tests.zlib.b64")
          path = pathlib.Path("apps/desktop/src/renderer/src/features/groups/GroupRoom.test.tsx")
          text = path.read_text()
          start = '  it("task panel: closed by default with a counter, grouped by status, Cancelled collapsed"'
          end = 'describe("GroupRoom decisions"'
          i0 = text.find(start)
          i1 = text.find(end)
          if i0 < 0 or i1 < 0:
              raise SystemExit(f"anchors missing {i0} {i1}")
          replacement = zlib.decompress(base64.b64decode(repl_path.read_text().strip())).decode()
          text = text[:i0] + replacement + text[i1:]
          old = (
              "    expect(\n"
              '      section.compareDocumentPosition(within(panel).getByTestId("task-section")) &\n'
              "        Node.DOCUMENT_POSITION_FOLLOWING,\n"
              "    ).toBeTruthy();"
          )
          new = (
              "    expect(\n"
              '      section.compareDocumentPosition(within(panel).getByTestId("task-checklist")) &\n'
              "        Node.DOCUMENT_POSITION_FOLLOWING,\n"
              "    ).toBeTruthy();"
          )
          if old not in text:
              raise SystemExit("task-section expect block missing")
          text = text.replace(old, new, 1)
          path.write_text(text)
          print("patched GroupRoom.test.tsx", len(text))
          PY
      - name: Commit tests and cleanup staging
        run: |
          git config user.name "Gabriel"
          git config user.email "stoltembergg@gmail.com"
          git add apps/desktop/src/renderer/src/features/groups/GroupRoom.test.tsx
          git rm -rf .github/agent-staging/p1a-panel .github/workflows/apply-p1a-panel.yml
          git commit -m "test(groups): update GroupRoom tests for Spring Check checklist (P1a)"
          git push origin HEAD:cursor/group-tasks-spring-p1a-cb29
