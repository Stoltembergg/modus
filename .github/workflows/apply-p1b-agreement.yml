name: apply-p1b-agreement
on:
  push:
    branches: [cursor/group-collab-p1b-cb29]
    paths: [.github/workflows/apply-p1b-agreement.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/group-collab-p1b-cb29
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Materialize staged files
        run: |
          python3 <<'PY'
          import base64, zlib, hashlib, pathlib
          staging = pathlib.Path(".github/agent-staging/p1b-agreement")
          files = [
            ("group-tools.ts.zlib.b64", "apps/desktop/src/main/agent/tools/group-tools.ts", "bae39febdfc4c9998e96322fc54f0fb6c78d11a7"),
            ("group-tools.test.ts.zlib.b64", "apps/desktop/src/main/agent/tools/group-tools.test.ts", "0095c1cb3402d044a309f34db06278d070c58407"),
            ("group-runtime.ts.zlib.b64", "apps/desktop/src/main/groups/group-runtime.ts", "188949113b9574bcf2ab93e8b51c4cf87a8c7fea"),
            ("group-store.ts.zlib.b64", "apps/desktop/src/main/groups/group-store.ts", "676fdc2d529dbfe043ae139dc9fafa743f572002"),
            ("group-runtime.test.ts.zlib.b64", "apps/desktop/src/main/groups/group-runtime.test.ts", "53c564b0b0ef5427685dbb25e38b4d5fead61e2a"),
          ]
          for name, dest, expect in files:
            raw = zlib.decompress(base64.b64decode((staging / name).read_text().strip()))
            digest = hashlib.sha1(b"blob %d\0" % len(raw) + raw).hexdigest()
            if digest != expect:
              raise SystemExit(f"blob mismatch {dest}: got {digest} want {expect}")
            pathlib.Path(dest).write_bytes(raw)
            print("wrote", dest, len(raw), digest)
          PY
      - name: Commit P1b sources and remove staging
        run: |
          git config user.name "Gabriel"
          git config user.email "stoltembergg@gmail.com"
          git add \
            apps/desktop/src/main/agent/tools/group-tools.ts \
            apps/desktop/src/main/agent/tools/group-tools.test.ts \
            apps/desktop/src/main/groups/group-runtime.ts \
            apps/desktop/src/main/groups/group-store.ts \
            apps/desktop/src/main/groups/group-runtime.test.ts
          git rm -rf .github/agent-staging/p1b-agreement .github/workflows/apply-p1b-agreement.yml
          git commit -m "feat(groups): agreement tools propose/agree/block/handoff (P1b)"
          git push origin HEAD:cursor/group-collab-p1b-cb29
