name: apply-p2-everyone
on:
  push:
    branches: [cursor/group-collab-p2-cb29]
    paths: [.github/workflows/apply-p2-everyone.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/group-collab-p2-cb29
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch @everyone consume
        run: |
          python3 <<'PY'
          from pathlib import Path
          lib = Path("apps/desktop/src/main/groups/group-runtime-lib.ts")
          test = Path("apps/desktop/src/main/groups/group-runtime.test.ts")
          lib_old = "  let rest = text;\n  for (const { handle, sessionIds } of handles) {"
          lib_new = (
            "  // P2: `@everyone` stays in the transcript (broadcast) but never mass-wakes.\n"
            '  let rest = text.replace(/@everyone(?![\\p{L}\\p{N}_-])/giu, " ");\n'
            "  for (const { handle, sessionIds } of handles) {"
          )
          test_old = (
            '    expect(parseGroupMentions("@b by id", members)).toEqual(["b"]);\n'
            "  });"
          )
          test_new = (
            '    expect(parseGroupMentions("@b by id", members)).toEqual(["b"]);\n'
            "    // @everyone is transcript-only: never expands to a mass wake.\n"
            '    expect(parseGroupMentions("@everyone please read", members)).toEqual([]);\n'
            '    expect(parseGroupMentions("@everyone and @Dev", members)).toEqual(["a"]);\n'
            "  });"
          )
          lt = lib.read_text()
          tt = test.read_text()
          if lib_old not in lt:
            raise SystemExit("lib anchor missing")
          if test_old not in tt:
            raise SystemExit("test anchor missing")
          lib.write_text(lt.replace(lib_old, lib_new, 1))
          test.write_text(tt.replace(test_old, test_new, 1))
          print("patched lib", lib.stat().st_size, "test", test.stat().st_size)
          PY
      - name: Commit and push
        run: |
          git config user.name "Gabriel"
          git config user.email "stoltembergg@gmail.com"
          git add apps/desktop/src/main/groups/group-runtime-lib.ts apps/desktop/src/main/groups/group-runtime.test.ts
          git rm -f .github/workflows/apply-p2-everyone.yml
          git commit -m "feat(groups): @everyone stays in transcript without mass wake (P2)"
          git push origin HEAD:cursor/group-collab-p2-cb29
