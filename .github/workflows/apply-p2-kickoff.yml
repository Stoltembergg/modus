name: apply-p2-kickoff
on:
  push:
    branches: [cursor/group-collab-p2-cb29]
    paths: [.github/workflows/apply-p2-kickoff.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/group-collab-p2-cb29
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Materialize staged files
        run: |
          python3 <<'PY'
          import base64, zlib, hashlib, pathlib
          staging = pathlib.Path(".github/agent-staging/p2-kickoff")
          # Assemble NewGroupModal from parts if present
          parts = sorted(staging.glob("NewGroupModal.tsx.zlib.b64.part*"))
          if parts:
            assembled = "".join(p.read_text().strip() for p in parts)
            (staging / "NewGroupModal.tsx.zlib.b64").write_text(assembled)
            print("assembled NewGroupModal from", len(parts), "parts", len(assembled))
          files = [
            ("groupKickoff.ts.zlib.b64", "apps/desktop/src/renderer/src/features/groups/groupKickoff.ts", "eb2fed4816e2559575de7e283f126b6d646e6c6c"),
            ("groupKickoff.test.ts.zlib.b64", "apps/desktop/src/renderer/src/features/groups/groupKickoff.test.ts", "e940a17a6b8e433d53487ba2aae73cc6ff6d59be"),
            ("newGroupModel.ts.zlib.b64", "apps/desktop/src/renderer/src/features/groups/newGroupModel.ts", "abde5b5edce4a8d3760c79cd93181b8f0e20dfb2"),
            ("newGroupModel.test.ts.zlib.b64", "apps/desktop/src/renderer/src/features/groups/newGroupModel.test.ts", "10914856e8e5387c57c119d78e17a0fb967ed520"),
            ("GroupComposer.tsx.zlib.b64", "apps/desktop/src/renderer/src/features/groups/GroupComposer.tsx", "862c51718562a468210442c55bc4f619b7ffc46d"),
            ("GroupMessageList.tsx.zlib.b64", "apps/desktop/src/renderer/src/features/groups/GroupMessageList.tsx", "af3272a52f15cf810b347f42eccc54c4850dcfbd"),
            ("GroupRoom.tsx.zlib.b64", "apps/desktop/src/renderer/src/features/groups/GroupRoom.tsx", "2471b0c443c60110875a4f2121e6d529e67a2a84"),
            ("NewGroupModal.tsx.zlib.b64", "apps/desktop/src/renderer/src/features/groups/NewGroupModal.tsx", "de556b0acbb8ba248e372127ee88665502fb5e22"),
            ("groupCollabStatus.ui.test.tsx.zlib.b64", "apps/desktop/src/renderer/src/features/groups/groupCollabStatus.ui.test.tsx", "822ace049fa35c51dab8a01d5d8382470ea8e807"),
          ]
          for name, dest, expect in files:
            raw = zlib.decompress(base64.b64decode((staging / name).read_text().strip()))
            digest = hashlib.sha1(b"blob %d\0" % len(raw) + raw).hexdigest()
            if digest != expect:
              raise SystemExit(f"blob mismatch {dest}: got {digest} want {expect}")
            pathlib.Path(dest).write_bytes(raw)
            print("wrote", dest, len(raw), digest)
          PY
      - name: Commit P2 sources and remove staging
        run: |
          git config user.name "Gabriel"
          git config user.email "stoltembergg@gmail.com"
          git add \
            apps/desktop/src/renderer/src/features/groups/groupKickoff.ts \
            apps/desktop/src/renderer/src/features/groups/groupKickoff.test.ts \
            apps/desktop/src/renderer/src/features/groups/newGroupModel.ts \
            apps/desktop/src/renderer/src/features/groups/newGroupModel.test.ts \
            apps/desktop/src/renderer/src/features/groups/GroupComposer.tsx \
            apps/desktop/src/renderer/src/features/groups/GroupMessageList.tsx \
            apps/desktop/src/renderer/src/features/groups/GroupRoom.tsx \
            apps/desktop/src/renderer/src/features/groups/NewGroupModal.tsx \
            apps/desktop/src/renderer/src/features/groups/groupCollabStatus.ui.test.tsx
          git rm -rf .github/agent-staging/p2-kickoff .github/workflows/apply-p2-kickoff.yml
          git commit -m "feat(groups): kickoff wizard, collab pipeline, handoff cards (P2)"
          git push origin HEAD:cursor/group-collab-p2-cb29
