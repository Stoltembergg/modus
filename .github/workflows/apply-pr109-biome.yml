name: Apply PR109 biome format fix
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apply-pr109-biome.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/resume-by-execution-id-db25
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install and biome-write
        run: |
          set -euo pipefail
          npm ci
          npx biome check --write \
            apps/desktop/src/main/groups/group-runtime-reliability.test.ts \
            apps/desktop/src/main/ipc/group-runtime-ipc.test.ts \
            apps/desktop/src/main/ipc/schemas-part-01.ts \
            apps/desktop/src/main/ipc/schemas-part-02.ts \
            apps/desktop/src/main/ipc/schemas-part-03.ts \
            apps/desktop/src/main/ipc/schemas-part-04.ts \
            apps/desktop/src/main/ipc/schemas-shared.ts
          for f in apps/desktop/src/main/ipc/schemas-part-0{1,2,3,4}.ts apps/desktop/src/main/ipc/schemas-shared.ts; do
            bytes=$(wc -c < "$f")
            test "$bytes" -gt 1000
            head -1 "$f" | grep -q 'import'
          done
          rm -f .github/workflows/apply-pr109-biome.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No biome changes"
            exit 0
          fi
          git commit -m "fix(ci): biome format resume PR modules"
          git push origin HEAD:cursor/resume-by-execution-id-db25
