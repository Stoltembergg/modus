name: apply-prompt-kit
on:
  workflow_dispatch:
  push:
    branches: [cursor/group-room-prompt-kit]
    paths:
      - "docs/_tmp/prompt-kit/**"
      - ".github/workflows/apply-prompt-kit.yml"
permissions:
  contents: write
concurrency:
  group: apply-prompt-kit
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/group-room-prompt-kit
      - name: Assemble zlib staging into apps paths
        run: |
          set -euo pipefail
          python3 -c '
          import base64, json, pathlib, subprocess, zlib
          root = pathlib.Path(".")
          manifest = json.loads((root / "docs/_tmp/prompt-kit/MANIFEST.json").read_text())
          for dest, meta in manifest.items():
              parts = meta["parts"]
              wanted = meta["wanted_blob"]
              raw_b64 = "".join((root / p).read_text().strip() for p in parts)
              data = zlib.decompress(base64.b64decode(raw_b64))
              out = root / dest
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_bytes(data)
              blob = subprocess.check_output(["git", "hash-object", str(out)], text=True).strip()
              print(f"{dest}: bytes={len(data)} blob={blob}")
              if blob != wanted:
                  raise SystemExit(f"blob mismatch for {dest}: got {blob} wanted {wanted}")
          print("all blobs OK")
          '
          rm -rf docs/_tmp/prompt-kit
          rm -f .github/workflows/apply-prompt-kit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "feat(groups): Prompt Kit transcript + file upload (materialize)"
          git push
