name: apply-resume-patches
on:
  push:
    branches: [cursor/resume-by-execution-id-db25]
    paths:
      - "internal/_push/resume/**"
      - ".github/workflows/apply-resume-patches.yml"
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/resume-by-execution-id-db25
          fetch-depth: 0
      - name: Skip if staging already cleaned
        id: guard
        run: |
          if [ ! -f internal/_push/resume/manifest.json ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No staging manifest; nothing to apply."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply resume patches
        if: steps.guard.outputs.skip == 'false'
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, hashlib, subprocess
          from pathlib import Path
          manifest = json.loads(Path("internal/_push/resume/manifest.json").read_text())
          for entry in manifest["files"]:
              path = Path(entry["path"])
              patch_path = Path(entry["patch_repo_path"])
              if not patch_path.is_file():
                  raise SystemExit(f"missing patch file: {patch_path}")
              if entry["strategy"] == "restore_from_ref_then_patch":
                  content = subprocess.check_output(
                      ["git", "show", f"{entry['base_ref']}:{entry['path']}"],
                      text=True,
                  )
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(content)
              subprocess.check_call(["patch", "-p1", "--batch", "-i", str(patch_path)])
              result = path.read_bytes()
              got = hashlib.sha256(result).hexdigest()
              if got != entry["expected_sha256"]:
                  raise SystemExit(
                      f"sha mismatch for {path}: got {got} want {entry['expected_sha256']}"
                  )
              if len(result) != entry["expected_bytes"]:
                  raise SystemExit(
                      f"byte mismatch for {path}: got {len(result)} want {entry['expected_bytes']}"
                  )
              print(f"OK {path} {len(result)} {got[:16]}")
          PY
      - name: Commit applied files and remove staging
        if: steps.guard.outputs.skip == 'false'
        run: |
          set -euo pipefail
          rm -rf internal/_push/resume
          rm -f .github/workflows/apply-resume-patches.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "feat(groups): apply resume-by-execution-id file patches"
          git push origin HEAD:cursor/resume-by-execution-id-db25
