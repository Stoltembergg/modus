name: apply-roomux-fix
on:
  push:
    branches: [cursor/natural-groups-room-ux]
    paths:
      - "docs/_tmp/roomux-fix-*.b64"
      - "docs/_tmp/roomux-fix-apply.py"
      - ".github/workflows/apply-roomux-fix.yml"
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/natural-groups-room-ux
          fetch-depth: 0
      - name: Apply biome fix patch
        run: python3 docs/_tmp/roomux-fix-apply.py
      - name: Commit and push
        run: |
          git config user.name "Gabriel"
          git config user.email "stoltembergg@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "fix(groups): biome format for natural room UX"
          git push origin HEAD:cursor/natural-groups-room-ux
