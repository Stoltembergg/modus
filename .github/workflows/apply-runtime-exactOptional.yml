name: Apply group-runtime exactOptional fix
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apply-runtime-exactOptional.yml"
      - "internal/_push/resume/group-runtime-exactOptional.patch"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/resume-by-execution-id-db25
          fetch-depth: 0
      - name: Apply patch
        run: |
          set -euo pipefail
          patch -p1 < internal/_push/resume/group-runtime-exactOptional.patch
          rm -f .github/workflows/apply-runtime-exactOptional.yml
          rm -f internal/_push/resume/group-runtime-exactOptional.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(groups): exactOptionalPropertyTypes in GroupRuntime.resumeExecution"
          git push origin HEAD:cursor/resume-by-execution-id-db25
