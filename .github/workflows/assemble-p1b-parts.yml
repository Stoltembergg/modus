name: assemble-p1b-parts
on:
  push:
    branches: [cursor/group-collab-p1b-cb29]
    paths: [.github/workflows/assemble-p1b-parts.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/group-collab-p1b-cb29
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Concatenate parts into staging blobs
        run: |
          python3 <<'PY'
          import hashlib, pathlib
          staging = pathlib.Path('.github/agent-staging/p1b-agreement')
          targets = {
            'group-store.ts.zlib.b64': 21864,
            'group-runtime.test.ts.zlib.b64': 12976,
          }
          expect_md5 = {
            'group-store.ts.zlib.b64': 'cd54860c64614cd2babb07223f6c73d6',
            'group-runtime.test.ts.zlib.b64': '3860e01270f4f7acb8d4ccf029b8cd9d',
          }
          for name, elen in targets.items():
            parts = sorted(staging.glob(name + '.part*'))
            if not parts:
              raise SystemExit(f'no parts for {name}')
            data = ''.join(p.read_text() for p in parts)
            if len(data) != elen:
              raise SystemExit(f'{name} len {len(data)} != {elen}')
            md5 = hashlib.md5(data.encode()).hexdigest()
            if md5 != expect_md5[name]:
              raise SystemExit(f'{name} md5 {md5} != {expect_md5[name]}')
            (staging / name).write_text(data)
            for p in parts:
              p.unlink()
            print('assembled', name, len(data), md5)
          PY
      - name: Commit assembled blobs
        run: |
          git config user.name "Gabriel"
          git config user.email "stoltembergg@gmail.com"
          git add -A .github/agent-staging/p1b-agreement
          git rm -f .github/workflows/assemble-p1b-parts.yml || true
          git status
          git commit -m "chore(groups): assemble P1b staging blobs from parts"
          git push origin HEAD:cursor/group-collab-p1b-cb29
