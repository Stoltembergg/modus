name: biome-fix-pr116
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/biome-fix-pr116.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/cursor/group-transcript-virtualization-c747'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Biome-format GroupMessageList and remove this workflow
        run: |
          set -euo pipefail
          git config user.email "stoltembergg@gmail.com"
          git config user.name "Gabriel"
          npm ci --ignore-scripts
          npx biome check --write \
            apps/desktop/src/renderer/src/features/groups/GroupMessageList.tsx
          git add apps/desktop/src/renderer/src/features/groups/GroupMessageList.tsx
          git rm -f .github/workflows/biome-fix-pr116.yml
          if git diff --cached --quiet; then
            echo 'nothing to commit'
            exit 0
          fi
          git commit -m "fix(groups): biome-format GroupMessageList liveTurn"
          git push origin HEAD:cursor/group-transcript-virtualization-c747
