name: cancel-own-queue-h0
on:
  workflow_dispatch:
  push:
    branches: [cursor/group-progress-final-card-c747]
    paths:
      - ".github/workflows/cancel-own-queue-h0.yml"
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cancel competing queued runs on this branch
        uses: actions/github-script@v7
        with:
          script: |
            const keepNames = new Set(['apply-h0-runtime-test', 'cancel-own-queue-h0']);
            const branch = 'cursor/group-progress-final-card-c747';
            const results = [];
            for (const status of ['queued', 'in_progress']) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch,
                status,
                per_page: 100,
              });
              for (const run of runs) {
                if (keepNames.has(run.name)) {
                  results.push({ run_id: run.id, status: 'kept', name: run.name, previous: run.status });
                  continue;
                }
                // Only cancel Package*/CI noise from our staging pushes
                if (!/^Package |^CI$/.test(run.name)) {
                  results.push({ run_id: run.id, status: 'skipped_other', name: run.name });
                  continue;
                }
                try {
                  await github.rest.actions.cancelWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id,
                  });
                  results.push({ run_id: run.id, status: 'canceled', name: run.name, previous: run.status, head_sha: run.head_sha });
                } catch (e) {
                  results.push({ run_id: run.id, status: 'error', name: run.name, message: e.message });
                }
              }
            }
            console.log(JSON.stringify(results, null, 2));
            await core.summary.addHeading('cancel-own-queue-h0').addCodeBlock(JSON.stringify(results, null, 2), 'json').write();
