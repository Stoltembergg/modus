name: cancel-stale-macos-117
on:
  push:
    branches: [cursor/group-conversation-minors-c747]
    paths:
      - 'internal/_push/cancel-macos117/READY'
permissions:
  actions: write
  contents: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel non-tip Package macOS (keep 31d8802f / 36864907236)
        uses: actions/github-script@v7
        with:
          script: |
            const keepSha = '31d8802fae51975b2c18d6d0ded875a66c6a0a81';
            const keepRun = 36864907236;
            const explicit = [36864574769, 36864844857, 36864860165];
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const cancelled = new Set();
            async function cancelRun(id, reason) {
              if (id === keepRun) {
                console.log('keep tip run', id);
                return;
              }
              if (cancelled.has(id)) return;
              try {
                await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: id });
                cancelled.add(id);
                console.log('cancelled', id, reason);
              } catch (e) {
                console.log('skip', id, e.status || '', e.message);
              }
            }
            for (const id of explicit) {
              await cancelRun(id, 'explicit');
            }
            for (const status of ['queued', 'in_progress', 'waiting', 'pending', 'requested']) {
              let page = 1;
              for (;;) {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  owner, repo,
                  branch: 'cursor/group-conversation-minors-c747',
                  status,
                  per_page: 100,
                  page,
                });
                for (const run of data.workflow_runs || []) {
                  if (!/macOS/i.test(run.name || '')) continue;
                  if (run.id === keepRun || run.head_sha === keepSha) {
                    console.log('keep', run.id, run.head_sha, run.status);
                    continue;
                  }
                  await cancelRun(run.id, `${status} head ${run.head_sha}`);
                }
                if (!data.workflow_runs || data.workflow_runs.length < 100) break;
                page += 1;
              }
            }
            console.log('done cancelled', [...cancelled]);
      - name: Remove one-shot helper
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Delete cancel helper artifacts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/cancel-stale-macos-117.yml
          rm -rf internal/_push/cancel-macos117
          git add -A
          if git diff --cached --quiet; then
            echo 'nothing to clean'
          else
            git commit -m 'chore: remove cancel-stale-macos-117 helper'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
