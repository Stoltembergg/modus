name: cancel-stale-macos-117
on:
  push:
    branches: [cursor/group-conversation-minors-c747]
    paths:
      - 'internal/_push/cancel-macos117/READY'
permissions:
  actions: write
  contents: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale Package macOS runs (keep current tip only)
        uses: actions/github-script@v7
        with:
          script: |
            const keepSha = context.sha;
            const explicit = [
              36862270662, 36862258880, 36862146092, 36862128779, 36862101772,
              36862041065, 36861996178, 36861867336, 36861847566, 36861733528,
              36861721799, 36861707999, 36861422936, 36861407370, 36861390030,
              36862342429, // prior tip f22cdc91 — obsolete once this canceler lands
            ];
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const cancelled = new Set();
            async function cancelRun(id, reason) {
              if (cancelled.has(id)) return;
              try {
                await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: id });
                cancelled.add(id);
                console.log('cancelled', id, reason);
              } catch (e) {
                console.log('skip', id, e.status || '', e.message);
              }
            }
            for (const id of explicit) {
              await cancelRun(id, 'explicit');
            }
            // Sweep any other queued Package macOS on this branch whose head ≠ this tip
            let page = 1;
            for (;;) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo,
                branch: 'cursor/group-conversation-minors-c747',
                status: 'queued',
                per_page: 100,
                page,
              });
              for (const run of data.workflow_runs || []) {
                if (!/macOS/i.test(run.name || '')) continue;
                if (run.head_sha === keepSha) {
                  console.log('keep tip run', run.id, run.head_sha);
                  continue;
                }
                await cancelRun(run.id, `stale head ${run.head_sha}`);
              }
              if (!data.workflow_runs || data.workflow_runs.length < 100) break;
              page += 1;
            }
            console.log('done cancelled', [...cancelled]);
      - name: Remove one-shot helper
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Delete cancel helper artifacts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/cancel-stale-macos-117.yml
          rm -rf internal/_push/cancel-macos117
          git add -A
          if git diff --cached --quiet; then
            echo 'nothing to clean'
          else
            git commit -m 'chore: remove cancel-stale-macos-117 helper'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
