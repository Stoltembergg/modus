name: fix-grouproom-test-resume
on:
  push:
    branches: [cursor/resume-by-execution-id-db25]
    paths:
      - ".github/workflows/fix-grouproom-test-resume.yml"
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/resume-by-execution-id-db25
          fetch-depth: 0
      - name: Restore GroupRoom.test.tsx from main baseline and apply resume patch
        run: |
          set -euo pipefail
          path="apps/desktop/src/renderer/src/features/groups/GroupRoom.test.tsx"
          base_ref="50df5bc667ac177b516c0ec9087f3e5474d4b717"
          patch_path="internal/_push/resume/apps__desktop__src__renderer__src__features__groups__GroupRoom.test.tsx.patch"
          expected_bytes=37083
          expected_sha256="25f63242237952e82d3caf7ab4df98fe73a6e2aa8411c1befd7e756494c17437"
          git show "${base_ref}:${path}" > "$path"
          patch -p1 --batch -i "$patch_path"
          python3 - <<'PY2'
          import hashlib
          from pathlib import Path
          p = Path("apps/desktop/src/renderer/src/features/groups/GroupRoom.test.tsx")
          data = p.read_bytes()
          got = hashlib.sha256(data).hexdigest()
          assert len(data) == 37083, len(data)
          assert got == "25f63242237952e82d3caf7ab4df98fe73a6e2aa8411c1befd7e756494c17437", got
          assert b"resumeExecution" in data
          assert b"by execution id" in data
          assert b"PLACEHOLDER" not in data
          print(f"OK {len(data)} {got}")
          PY2
      - name: Commit full test file and remove this one-shot workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-grouproom-test-resume.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "test(groups): GroupRoom resumes by execution id"
          git push origin HEAD:cursor/resume-by-execution-id-db25
