name: gap3-restore-contracts
on:
  push:
    paths:
      - .github/workflows/gap3-restore-contracts.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Restore contracts.ts via Contents API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, json, os, urllib.request

          token = os.environ["GH_TOKEN"]
          owner, repo = "Stoltembergg", "modus"
          branch = "cursor/blacklist-management-ui-c747"
          path = "apps/desktop/src/shared/contracts.ts"
          block = '/** Cross-session soft-discouraged strategy entry (TTL-bound; never a hard permanent block). */\nexport type FailureBlacklistEntry = {\n  id: string;\n  workspaceId: string;\n  signature: string;\n  strategyCode: string;\n  hypothesisCode?: string;\n  hitCount: number;\n  firstSeenAt: string;\n  lastSeenAt: string;\n  expiresAt: string;\n  status: "active" | "cleared" | "expired";\n  sourceRunId?: string;\n};\n\n'

          def api(method, url, data=None):
              req = urllib.request.Request(
                  url,
                  data=None if data is None else json.dumps(data).encode(),
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                      "User-Agent": "gap3-restore",
                  },
              )
              with urllib.request.urlopen(req) as resp:
                  return json.load(resp)

          main_url = f"https://raw.githubusercontent.com/{owner}/{repo}/main/{path}"
          with urllib.request.urlopen(main_url) as resp:
              text = resp.read().decode()
          anchor = "export type AgentEvent"
          if "FailureBlacklistEntry" not in text:
              if anchor not in text:
                  raise SystemExit("anchor missing on main contracts")
              text = text.replace(anchor, block + anchor, 1)
          if "FailureBlacklistEntry" not in text:
              raise SystemExit("insert failed")

          meta = api("GET", f"https://api.github.com/repos/{owner}/{repo}/contents/{path}?ref={branch}")
          sha = meta["sha"]
          body = {
              "message": "fix(contracts): restore Gap 3 FailureBlacklistEntry contracts",
              "content": base64.b64encode(text.encode()).decode(),
              "branch": branch,
              "sha": sha,
          }
          result = api("PUT", f"https://api.github.com/repos/{owner}/{repo}/contents/{path}", body)
          print("commit", result["commit"]["sha"])
          print("size", result["content"]["size"])

          # delete workflow file
          wf_path = ".github/workflows/gap3-restore-contracts.yml"
          try:
              wf_meta = api("GET", f"https://api.github.com/repos/{owner}/{repo}/contents/{wf_path}?ref={branch}")
              api("DELETE", f"https://api.github.com/repos/{owner}/{repo}/contents/{wf_path}", {
                  "message": "chore: remove gap3-restore-contracts workflow",
                  "sha": wf_meta["sha"],
                  "branch": branch,
              })
              print("workflow removed")
          except Exception as exc:
              print("workflow cleanup skipped:", exc)
          PY
