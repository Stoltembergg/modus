name: gap3-restore-contracts
on:
  push:
    paths:
      - .github/workflows/gap3-restore-contracts.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Restore contracts.ts via Contents API from known-good commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          GOOD_REF=536487b7cb57
          PATH_FILE=apps/desktop/src/shared/contracts.ts
          BRANCH=cursor/blacklist-management-ui-c747
          META=$(gh api "repos/${{ github.repository }}/contents/${PATH_FILE}?ref=${GOOD_REF}")
          CONTENT_B64=$(printf '%s' "$META" | python3 -c 'import sys,json; print(json.load(sys.stdin)["content"].replace("\n",""))')
          printf '%s' "$CONTENT_B64" | base64 -d > /tmp/contracts.ts
          python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/contracts.ts').read_text()
          print('chars', len(text))
          assert len(text) > 60000
          assert 'export type FailureBlacklistEntry' in text
          assert text.strip() != 'PLACEHOLDER'
          assert '{{INCLUDE' not in text
          assert text.startswith('export type WorkspaceInfo')
          PY
          CUR_SHA=$(gh api "repos/${{ github.repository }}/contents/${PATH_FILE}?ref=${BRANCH}" --jq .sha)
          echo "current sha=$CUR_SHA"
          gh api --method PUT "repos/${{ github.repository }}/contents/${PATH_FILE}" \
            -f message='fix(contracts): restore shared contracts with FailureBlacklistEntry' \
            -f content="$CONTENT_B64" \
            -f sha="$CUR_SHA" \
            -f branch="$BRANCH"
          echo "PUT ok"
      - name: Remove self
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH=cursor/blacklist-management-ui-c747
          PATH_FILE=.github/workflows/gap3-restore-contracts.yml
          SHA=$(gh api "repos/${{ github.repository }}/contents/${PATH_FILE}?ref=${BRANCH}" --jq .sha || true)
          if [ -n "${SHA:-}" ]; then
            gh api --method DELETE "repos/${{ github.repository }}/contents/${PATH_FILE}" \
              -f message='chore: remove gap3-restore-contracts workflow' \
              -f sha="$SHA" \
              -f branch="$BRANCH" || true
          fi
