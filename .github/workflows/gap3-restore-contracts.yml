name: gap3-restore-contracts
on:
  push:
    paths:
      - .github/workflows/gap3-restore-contracts.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/blacklist-management-ui-c747
          fetch-depth: 0
      - name: Restore contracts.ts from main + FailureBlacklistEntry
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:apps/desktop/src/shared/contracts.ts > apps/desktop/src/shared/contracts.ts
          python3 <<'PY'
          from pathlib import Path
          path = Path("apps/desktop/src/shared/contracts.ts")
          text = path.read_text()
          block = """/** Cross-session soft-discouraged strategy entry (TTL-bound; never a hard permanent block). */
export type FailureBlacklistEntry = {
  id: string;
  workspaceId: string;
  signature: string;
  strategyCode: string;
  hypothesisCode?: string;
  hitCount: number;
  firstSeenAt: string;
  lastSeenAt: string;
  expiresAt: string;
  status: "active" | "cleared" | "expired";
  sourceRunId?: string;
};

"""
          anchor = "export type AgentEvent"
          if "FailureBlacklistEntry" not in text:
              if anchor not in text:
                  raise SystemExit("anchor missing")
              text = text.replace(anchor, block + anchor, 1)
              path.write_text(text)
          print("contracts bytes", path.stat().st_size)
          if "FailureBlacklistEntry" not in path.read_text():
              raise SystemExit("insert failed")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/shared/contracts.ts
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "fix(contracts): restore Gap 3 FailureBlacklistEntry contracts"
            git push origin HEAD:cursor/blacklist-management-ui-c747
          fi
      - name: Remove self
        if: always()
        run: |
          set -euo pipefail
          if [ -f .github/workflows/gap3-restore-contracts.yml ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm -f .github/workflows/gap3-restore-contracts.yml
            git commit -m "chore: remove gap3-restore-contracts workflow" || true
            git push origin HEAD:cursor/blacklist-management-ui-c747 || true
          fi
