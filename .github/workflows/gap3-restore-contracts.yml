name: gap3-restore-contracts
on:
  push:
    paths:
      - .github/workflows/gap3-restore-contracts.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Restore contracts.ts from known-good commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          GOOD_REF=536487b7cb57678739f85c685869dad51e9a8f41
          PATH_FILE=apps/desktop/src/shared/contracts.ts
          BRANCH=cursor/blacklist-management-ui-c747
          REPO="${{ github.repository }}"

          META=$(gh api "repos/${REPO}/contents/${PATH_FILE}?ref=${GOOD_REF}")
          CONTENT_B64=$(printf '%s' "$META" | python3 -c 'import sys,json; print(json.load(sys.stdin)["content"].replace("\n",""))')
          GOOD_BLOB=$(printf '%s' "$META" | python3 -c 'import sys,json; print(json.load(sys.stdin)["sha"])')
          printf '%s' "$CONTENT_B64" | base64 -d > /tmp/contracts.ts

          python3 - <<'PY'
          from pathlib import Path
          raw = Path("/tmp/contracts.ts").read_bytes()
          text = raw.decode()
          print("bytes", len(raw), "chars", len(text))
          assert len(raw) == 65330, len(raw)
          assert "FailureBlacklistEntry" in text
          assert "WorkspaceInfo" in text
          assert "PLACEHOLDER" not in text
          assert "INCLUDE_FROM_FILE" not in text
          assert text.startswith("export type WorkspaceInfo")
          PY

          echo "good_blob=$GOOD_BLOB"
          CUR_SHA=$(gh api "repos/${REPO}/contents/${PATH_FILE}?ref=${BRANCH}" --jq .sha)
          echo "current_sha=$CUR_SHA"

          gh api --method PUT "repos/${REPO}/contents/${PATH_FILE}" \
            -f message='fix(contracts): restore full contracts.ts after PLACEHOLDER regression' \
            -f content="$CONTENT_B64" \
            -f sha="$CUR_SHA" \
            -f branch="$BRANCH"

          META2=$(gh api "repos/${REPO}/contents/${PATH_FILE}?ref=${BRANCH}")
          SIZE2=$(printf '%s' "$META2" | python3 -c 'import sys,json; print(json.load(sys.stdin)["size"])')
          SHA2=$(printf '%s' "$META2" | python3 -c 'import sys,json; print(json.load(sys.stdin)["sha"])')
          echo "verified size=$SIZE2 blob=$SHA2"
          test "$SIZE2" = "65330"
          test "$SHA2" = "$GOOD_BLOB"

      - name: Remove self
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH=cursor/blacklist-management-ui-c747
          PATH_FILE=.github/workflows/gap3-restore-contracts.yml
          REPO="${{ github.repository }}"
          SHA=$(gh api "repos/${REPO}/contents/${PATH_FILE}?ref=${BRANCH}" --jq .sha || true)
          if [ -n "${SHA:-}" ]; then
            gh api --method DELETE "repos/${REPO}/contents/${PATH_FILE}" \
              -f message='chore: remove gap3-restore-contracts workflow' \
              -f sha="$SHA" \
              -f branch="$BRANCH" || true
          fi
