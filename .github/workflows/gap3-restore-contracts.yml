name: gap3-restore-contracts
on:
  push:
    paths:
      - .github/workflows/gap3-restore-contracts.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/blacklist-management-ui-c747
          fetch-depth: 0
      - name: Restore contracts.ts from known-good commit
        run: |
          set -euo pipefail
          git fetch origin 536487b7cb57
          git show 536487b7cb57:apps/desktop/src/shared/contracts.ts > apps/desktop/src/shared/contracts.ts
          python3 <<'PY'
          from pathlib import Path
          path = Path("apps/desktop/src/shared/contracts.ts")
          text = path.read_text()
          print("contracts chars", len(text))
          assert len(text) > 60000
          assert "export type FailureBlacklistEntry" in text
          assert text.strip() != "PLACEHOLDER"
          assert "{{INCLUDE" not in text
          assert text.startswith("export type WorkspaceInfo")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/shared/contracts.ts
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "fix(contracts): restore shared contracts with FailureBlacklistEntry"
            git push origin HEAD:cursor/blacklist-management-ui-c747
          fi
      - name: Remove self
        if: always()
        run: |
          set -euo pipefail
          if [ -f .github/workflows/gap3-restore-contracts.yml ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm -f .github/workflows/gap3-restore-contracts.yml
            git commit -m "chore: remove gap3-restore-contracts workflow" || true
            git push origin HEAD:cursor/blacklist-management-ui-c747 || true
          fi
