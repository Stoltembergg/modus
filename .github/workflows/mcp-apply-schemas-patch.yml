name: mcp-apply-schemas-patch
on:
  push:
    branches: [cursor/group-execution-linking-c747]
    paths: [.mcp-restore/exec-link/TRIGGER-schemas-patch]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/group-execution-linking-c747
      - name: Apply patch and verify
        run: |
          set -euo pipefail
          git apply .mcp-restore/exec-link/schemas.ts.patch
          TARGET=apps/desktop/src/main/ipc/schemas.ts
          BYTES=$(wc -c < "$TARGET")
          SHA=$(sha256sum "$TARGET" | awk '{print $1}')
          LINES=$(wc -l < "$TARGET")
          echo "bytes=$BYTES sha=$SHA lines=$LINES"
          test "$BYTES" -eq 33894
          test "$SHA" = "746be98000c3d6d662d535a6f9de592520f924aa0b4310bf2e67043e5401f522"
          test "$LINES" -eq 1096
          grep -q 'groupPostMessageSchema' "$TARGET"
          grep -q 'agentCreateSchema' "$TARGET"
          grep -q 'MAX_GROUP_MESSAGE_BODY' "$TARGET"
          grep -q 'executionMode' "$TARGET"
          grep -q 'executionId' "$TARGET"
          test "$LINES" -gt 100
      - name: Commit and cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/main/ipc/schemas.ts
          git commit -m "feat(groups): accept executionMode/executionId on post-message schema"
          git rm -r .mcp-restore/exec-link .github/workflows/mcp-apply-schemas-patch.yml || true
          git commit -m "chore: cleanup schemas patch assemble artifacts" || true
          git push
