name: mcp-assemble-lib
on:
  workflow_dispatch:
  push:
    paths:
      - ".mcp-restore/TRIGGER"
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble lib from chunks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -ex
          ls -la .mcp-restore || true
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          parts = sorted(Path(".mcp-restore").glob("group-runtime-lib.ts.*"))
          print("parts", [p.name for p in parts])
          if not parts:
              raise SystemExit("no chunks")
          text = "".join(p.read_text(encoding="utf-8") for p in parts)
          dest = Path("apps/desktop/src/main/groups/group-runtime-lib.ts")
          dest.parent.mkdir(parents=True, exist_ok=True)
          dest.write_text(text, encoding="utf-8")
          data = text.encode("utf-8")
          header = f"blob {len(data)}\0".encode("ascii")
          blob = hashlib.sha1(header + data).hexdigest()
          print("blob", blob, "bytes", len(data))
          expect = "ad2a790ae1b851feda995234a9984d24aa82b939"
          if blob != expect:
              raise SystemExit(f"blob mismatch: {blob} != {expect}")
          PY
          rm -rf .mcp-restore
          rm -f .github/workflows/mcp-assemble-lib.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "feat(groups): inject supervised flow into Coordinator Lead wakes"
          git push origin HEAD:cursor/group-supervised-flow-c747
