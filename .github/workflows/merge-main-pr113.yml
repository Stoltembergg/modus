name: merge-main-pr113
# Resolves known GroupMessageList conflict: keep main liveTurn + PR onExecutionFilter.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/merge-main-pr113.yml
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/cursor/group-execution-linking-c747'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/group-execution-linking-c747
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge main with known resolution
        run: |
          set -euo pipefail
          git config user.email "stoltembergg@gmail.com"
          git config user.name "Gabriel"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo main already ancestor
            exit 0
          fi
          set +e
          git merge origin/main --no-edit
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            git push origin HEAD:cursor/group-execution-linking-c747
            exit 0
          fi
          f=apps/desktop/src/renderer/src/features/groups/GroupMessageList.tsx
          test -f "$f"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("apps/desktop/src/renderer/src/features/groups/GroupMessageList.tsx")
          text = p.read_text()
          if "<<<<<<<" not in text:
              raise SystemExit("expected conflict markers")
          # Prefer origin/main body (liveTurn) and inject onExecutionFilter.
          pattern = re.compile(r"<<<<<<< HEAD\n.*?=======\n(.*?)>>>>>>> origin/main\n", re.S)
          m = pattern.search(text)
          if not m:
              raise SystemExit("conflict pattern mismatch")
          theirs = m.group(1)
          if "onExecutionFilter={onExecutionFilterChange}" not in theirs:
              theirs = theirs.replace(
                  "message={message}\n",
                  "message={message}\n                onExecutionFilter={onExecutionFilterChange}\n",
                  1,
              )
          text = pattern.sub(theirs, text, count=1)
          if "<<<<<<<" in text:
              raise SystemExit("unresolved markers remain")
          if "onExecutionFilter={onExecutionFilterChange}" not in text:
              raise SystemExit("missing onExecutionFilter after resolve")
          if "liveTurn=" not in text:
              raise SystemExit("missing liveTurn after resolve")
          p.write_text(text)
          PY
          git add -A
          git commit -m "merge main into group-execution-linking: keep liveTurn + execution filter"
          ! grep -R --include='*.ts' --include='*.tsx' -n 'LOAD_FROM_FILE\|PLACEHOLDER_WILL_REPLACE' apps/desktop/src || exit 1
          git push origin HEAD:cursor/group-execution-linking-c747
