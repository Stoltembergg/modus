name: Refresh model catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Generate catalog from latest pi-ai
        run: |
          runtime_dir="$RUNNER_TEMP/model-catalog-runtime"
          npm install --prefix "$runtime_dir" --no-save --package-lock=false --ignore-scripts @earendil-works/pi-ai@latest
          mv node_modules/@earendil-works/pi-ai "$RUNNER_TEMP/model-catalog-pi-ai-locked"
          ln -s "$runtime_dir/node_modules/@earendil-works/pi-ai" node_modules/@earendil-works/pi-ai
          node scripts/generate-model-catalog.mjs
          npx vitest run --root . apps/desktop/src/main/agent/model-catalog-service.test.ts apps/desktop/scripts/model-catalog-utils.test.mjs
      - name: Publish catalog update
        run: |
          branch=automation/model-catalog
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin "$branch:refs/remotes/origin/$branch" || true
          git switch -C "$branch"
          git add catalog/models.json
          git diff --cached --quiet || git commit -m "chore(models): refresh runtime catalog"
          git push --force-with-lease origin "HEAD:$branch"
