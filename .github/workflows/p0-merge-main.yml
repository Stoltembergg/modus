name: p0-merge-main
on:
  push:
    branches: [cursor/hyperplan-p0-failure-reason-model-12c1]
    paths: [.p0-merge/**]
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/hyperplan-p0-failure-reason-model-12c1
          fetch-depth: 0
      - name: Merge main and resolve register-app-ipc
        run: |
          set -euo pipefail
          git config user.name "Gabriel"
          git config user.email "stoltembergg@gmail.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "main already merged"
          else
            set +e
            git merge origin/main --no-edit
            merge_rc=$?
            set -e
            if [ "$merge_rc" -ne 0 ]; then
              python3 .p0-merge/resolve_register_app_ipc.py
              git add apps/desktop/src/main/ipc/register-app-ipc.ts
              if git diff --name-only --diff-filter=U | grep -q .; then
                echo "Unresolved conflict files remain:" >&2
                git diff --name-only --diff-filter=U >&2
                exit 1
              fi
              if grep -Rne '^<<<<<<<\|^>>>>>>>' --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' --include='*.json' --include='*.yml' --include='*.md' .; then
                echo "Unresolved conflict markers remain" >&2
                exit 1
              fi
              git commit --no-edit
            fi
          fi
          rm -rf .p0-merge .github/workflows/p0-merge-main.yml
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to clean"
          else
            git commit -m "chore(p0): drop merge-main helper after syncing main"
          fi
          git push origin HEAD:cursor/hyperplan-p0-failure-reason-model-12c1
