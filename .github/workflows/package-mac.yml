name: Package macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/package-mac.yml"

permissions:
  contents: read

jobs:
  package-mac:
    name: package (${{ matrix.electron_arch }})
    runs-on: macos-14
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - electron_arch: arm64
            rust_target: aarch64-apple-darwin
            codegraph_arch: arm64
          - electron_arch: x64
            rust_target: x86_64-apple-darwin
            codegraph_arch: x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19"
          cache: npm

      - name: Install Rust stable (${{ matrix.rust_target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install dependencies
        run: npm ci

      - name: Ensure CodeGraph package for target arch
        run: |
          set -euo pipefail
          PKG="@colbymchenry/codegraph-darwin-${{ matrix.codegraph_arch }}"
          if node -e "require.resolve('${PKG}/package.json')" 2>/dev/null; then
            echo "already resolvable: ${PKG}"
            node -e "console.log(require.resolve('${PKG}/package.json'))"
            exit 0
          fi
          echo "Fetching ${PKG}@1.1.1 via npm pack"
          TARBALL="$(npm pack "${PKG}@1.1.1")"
          mkdir -p "node_modules/@colbymchenry/codegraph-darwin-${{ matrix.codegraph_arch }}"
          tar -xzf "${TARBALL}" -C "node_modules/@colbymchenry/codegraph-darwin-${{ matrix.codegraph_arch }}" --strip-components=1
          rm -f "${TARBALL}"
          node -e "console.log(require.resolve('${PKG}/package.json'))"

      - name: Build PTY host (${{ matrix.rust_target }})
        run: |
          cargo build --release -p modus-pty-host --target "${{ matrix.rust_target }}"
          mkdir -p target/release
          cp "target/${{ matrix.rust_target }}/release/modus-pty-host" target/release/modus-pty-host
          file target/release/modus-pty-host

      - name: Verify Electron binary
        run: |
          node -e "console.log('electron=', require('electron'))"
          ls -lah node_modules/electron/dist || ls -lah apps/desktop/node_modules/electron/dist || true

      - name: Build Electron app
        env:
          # Large renderer (Monaco/Mermaid) can abort under default heap on GHA mac runners.
          NODE_OPTIONS: --max-old-space-size=8192
          MAIN_VITE_SUPABASE_URL: ${{ vars.MAIN_VITE_SUPABASE_URL }}
          MAIN_VITE_SUPABASE_ANON_KEY: ${{ vars.MAIN_VITE_SUPABASE_ANON_KEY }}
          MAIN_VITE_AUTH_EMAIL_REDIRECT_URL: ${{ vars.MAIN_VITE_AUTH_EMAIL_REDIRECT_URL || 'https://modus-site-ruby.vercel.app/auth/confirmed' }}
        run: |
          set +e
          npm --workspace @modus/desktop exec -- electron-vite build > electron-vite-build.log 2>&1
          status=$?
          set -e
          echo "electron-vite exit=${status} log_bytes=$(wc -c < electron-vite-build.log | tr -d ' ')"
          if [ "$status" -ne 0 ]; then
            echo "::group::electron-vite build log (tail)"
            tail -n 160 electron-vite-build.log || true
            echo "::endgroup::"
            # Single annotation: last 3KB, printable only (public without job-log auth).
            MSG="$(tail -c 3000 electron-vite-build.log | tr -cd '\11\12\15\40-\176' | sed 's/::/[:]/g' | tr '\n' ' ')"
            echo "::error title=electron-vite::${MSG}"
            exit "$status"
          fi

      - name: Verify packaged glass (D2)
        # Main window options + the built renderer in headless Chrome: <html> and the
        # shell must stay transparent under native glass (PR #152 regression).
        run: node apps/desktop/scripts/verify-packaged-glass.mjs apps/desktop/out

      - name: Upload electron-vite log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-vite-log-mac-${{ matrix.electron_arch }}-${{ github.sha }}
          path: electron-vite-build.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Package macOS ${{ matrix.electron_arch }} (unsigned)
        env:
          # Test compile only — no Developer ID / notarization in this workflow.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          NODE_OPTIONS: --max-old-space-size=8192
          MODUS_CODEGRAPH_PLATFORM: darwin
          MODUS_CODEGRAPH_ARCH: ${{ matrix.codegraph_arch }}
        run: |
          npm --workspace @modus/desktop run package:mac -- \
            --${{ matrix.electron_arch }} \
            --publish never

      - name: List dist
        run: ls -lah apps/desktop/dist

      - name: Upload macOS ${{ matrix.electron_arch }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: modus-macos-${{ matrix.electron_arch }}-${{ github.sha }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/mac*/**
          if-no-files-found: warn
          retention-days: 7
