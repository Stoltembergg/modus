name: Authorized plugin security scenarios

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: "Explicitly authorize adversarial and fuel-enforcement plugin test cases by entering RUN_PLUGIN_SECURITY_SCENARIOS."
        required: true
        type: string

jobs:
  security-scenarios:
    if: github.event_name == 'workflow_dispatch' && inputs.authorization == 'RUN_PLUGIN_SECURITY_SCENARIOS'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run explicitly authorized plugin security scenarios
        run: >
          npx vitest run --root . --no-file-parallelism --maxWorkers=1 --testTimeout=20000
          apps/desktop/src/main/agent/harness/plugin/plugin-isolation.test.ts
          apps/desktop/src/main/agent/harness/plugin/wasm/wasm-sandbox.test.ts
          --testNamePattern='(adversarial bypass hardening|enforces timeout for hanging or infinite-looping community plugins|throws WasmFuelExhaustedError and cleanly interrupts infinite/runaway loop|captures fuel exhaustion gracefully in executeWasm without crashing host)'
