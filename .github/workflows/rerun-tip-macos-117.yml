name: rerun-tip-macos-117
on:
  push:
    branches: [cursor/rerun-macos-117-7ef8]
permissions:
  actions: write
jobs:
  rerun:
    runs-on: ubuntu-latest
    steps:
      - name: Re-run failed tip arm64 Package job only
        uses: actions/github-script@v7
        with:
          script: |
            const tipSha = '5c555869539666fdea9638736a4fda7fde317253';
            const runId = 36866125741;
            const jobId = 110382615071; // package (arm64) Verify Electron flake
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId });
            console.log('run', run.id, run.head_sha, run.status, run.conclusion);
            if (run.head_sha !== tipSha) throw new Error(`refusing: head ${run.head_sha}`);
            const { data: job } = await github.rest.actions.getJobForWorkflowRun({ owner, repo, job_id: jobId });
            console.log('job', job.id, job.name, job.status, job.conclusion);
            if (!/arm64/i.test(job.name || '')) throw new Error(`refusing non-arm64 job ${job.name}`);
            // Single-job rerun — must not cancel sibling x64.
            await github.rest.actions.reRunJobForWorkflowRun({ owner, repo, job_id: jobId });
            console.log('reRunJobForWorkflowRun requested', jobId);
