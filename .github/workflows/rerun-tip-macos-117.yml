name: rerun-tip-macos-117
on:
  push:
    branches: [cursor/rerun-macos-117-7ef8]
permissions:
  actions: write
jobs:
  rerun:
    runs-on: ubuntu-latest
    steps:
      - name: Re-run failed tip Package macOS jobs
        uses: actions/github-script@v7
        with:
          script: |
            const tipSha = '5c555869539666fdea9638736a4fda7fde317253';
            const runId = 36866125741;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId });
            console.log('run', run.id, run.head_sha, run.status, run.conclusion);
            if (run.head_sha !== tipSha) throw new Error(`refusing: head ${run.head_sha}`);
            if (run.status !== 'completed') throw new Error(`refusing: run still ${run.status}`);
            await github.rest.actions.reRunWorkflowFailedJobs({ owner, repo, run_id: runId });
            console.log('reRunWorkflowFailedJobs ok', runId);
