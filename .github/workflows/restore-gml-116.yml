name: restore-gml-116
on:
  push:
    branches: [cursor/group-transcript-virtualization-c747]
    paths: [".github/workflows/restore-gml-116.yml"]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/group-transcript-virtualization-c747
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore GroupMessageRow with execution chip hoist
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- apps/desktop/src/renderer/src/features/groups/GroupMessageRow.tsx
          python3 - <<'PY'
          from pathlib import Path
          path = Path("apps/desktop/src/renderer/src/features/groups/GroupMessageRow.tsx")
          text = path.read_text()
          old = '''  const status = message.status;
  // Live turns already show concrete phases — do not stamp opaque "Working".
  if (!status || status === "running" || status === "writing")
    return (
      <span className="ml-auto inline-flex flex-wrap items-baseline gap-x-1.5 font-normal text-2xs text-fg-faint">
        <time dateTime={message.createdAt} title={new Date(message.createdAt).toLocaleString()}>
          {formatClock(Date.parse(message.createdAt))}
        </time>
      </span>
    );
  const label = {
    queued: "Queued",
    awaiting_user: "Waiting for you",
    completed: "Completed",
    failed: "Failed",
    cancelled: "Cancelled",
    interrupted: "Interrupted",
  }[status];
  const warning = status === "failed" || status === "interrupted";
  const executionId = messageExecutionId(message);
  const showChip = message.authorKind === "user" || Boolean(message.chainId);
  const chipTitle = message.authorKind === "user" ? message.body.trim().slice(0, 80) : undefined;
  return (
    <span className="ml-auto inline-flex flex-wrap items-baseline gap-x-1.5 font-normal text-2xs text-fg-faint">
      {showChip ? (
        <button
          className="rounded-sm border border-hairline px-1 py-px font-mono text-fg-muted hover:border-accent/40 hover:text-fg"
          data-execution-id={executionId}
          data-testid="group-execution-chip"
          onClick={() => onExecutionFilter?.(executionId)}
          title={chipTitle ? `Filter to: ${chipTitle}` : "Filter transcript to this execution"}
          type="button"
        >
          #{shortExecutionLabel(executionId)}
        </button>
      ) : null}
      <time dateTime={message.createdAt} title={new Date(message.createdAt).toLocaleString()}>
        {formatClock(Date.parse(message.createdAt))}
      </time>'''
          new = '''  const status = message.status;
  const executionId = messageExecutionId(message);
  const showChip = message.authorKind === "user" || Boolean(message.chainId);
  const chipTitle = message.authorKind === "user" ? message.body.trim().slice(0, 80) : undefined;
  const executionChip = showChip ? (
    <button
      className="rounded-sm border border-hairline px-1 py-px font-mono text-fg-muted hover:border-accent/40 hover:text-fg"
      data-execution-id={executionId}
      data-testid="group-execution-chip"
      onClick={() => onExecutionFilter?.(executionId)}
      title={chipTitle ? `Filter to: ${chipTitle}` : "Filter transcript to this execution"}
      type="button"
    >
      #{shortExecutionLabel(executionId)}
    </button>
  ) : null;
  // Live turns already show concrete phases — do not stamp opaque "Working".
  if (!status || status === "running" || status === "writing")
    return (
      <span className="ml-auto inline-flex flex-wrap items-baseline gap-x-1.5 font-normal text-2xs text-fg-faint">
        {executionChip}
        <time dateTime={message.createdAt} title={new Date(message.createdAt).toLocaleString()}>
          {formatClock(Date.parse(message.createdAt))}
        </time>
      </span>
    );
  const label = {
    queued: "Queued",
    awaiting_user: "Waiting for you",
    completed: "Completed",
    failed: "Failed",
    cancelled: "Cancelled",
    interrupted: "Interrupted",
  }[status];
  const warning = status === "failed" || status === "interrupted";
  return (
    <span className="ml-auto inline-flex flex-wrap items-baseline gap-x-1.5 font-normal text-2xs text-fg-faint">
      {executionChip}
      <time dateTime={message.createdAt} title={new Date(message.createdAt).toLocaleString()}>
        {formatClock(Date.parse(message.createdAt))}
      </time>'''
          if old not in text:
              raise SystemExit("OLD_BLOCK_NOT_FOUND")
          path.write_text(text.replace(old, new, 1))
          print("patched ok")
          PY
          rm -f .github/workflows/restore-gml-116.yml
          git add apps/desktop/src/renderer/src/features/groups/GroupMessageRow.tsx
          git add -A .github/workflows
          git commit -m "fix(groups): restore MessageMeta execution chip hoist (#116)"
          git push
