name: restore-gml-b64-116
on:
  push:
    branches: [cursor/group-transcript-virtualization-c747]
    paths: [".github/workflows/restore-gml-b64-116.yml"]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/group-transcript-virtualization-c747
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Decode and restore GroupMessageRow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat _agent_push/gml116-part1.b64 _agent_push/gml116-part2.b64 _agent_push/gml116-part3.b64 _agent_push/gml116-part4.b64 _agent_push/gml116-part5.b64 _agent_push/gml116-part6.b64 | tr -d '\n' | base64 -d > apps/desktop/src/renderer/src/features/groups/GroupMessageRow.tsx
          test -s apps/desktop/src/renderer/src/features/groups/GroupMessageRow.tsx
          grep -q executionChip apps/desktop/src/renderer/src/features/groups/GroupMessageRow.tsx
          grep -q "export function GroupMessageRow" apps/desktop/src/renderer/src/features/groups/GroupMessageRow.tsx
          rm -f .github/workflows/restore-gml-b64-116.yml .github/workflows/restore-gml-116.yml
          rm -f _agent_push/gml116-part1.b64 _agent_push/gml116-part2.b64 _agent_push/gml116-part3.b64 _agent_push/gml116-part4.b64 _agent_push/gml116-part5.b64 _agent_push/gml116-part6.b64
          git add -A
          git commit -m "fix(groups): restore MessageMeta execution chip hoist (#116)"
          git push
