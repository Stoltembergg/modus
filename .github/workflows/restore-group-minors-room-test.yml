# restore GroupRoom.test to local tip blob 32ef929f
name: restore-group-minors-room-test
on:
  push:
    branches: [cursor/group-conversation-minors-c747]
    paths:
      - '.github/workflows/restore-group-minors-room-test.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore GroupRoom.test.tsx from 79b3d3b3
        run: |
          set -euo pipefail
          GOOD=79b3d3b3de7c4c19bd8883e6c3f058cc72f4bacc
          git checkout "$GOOD" -- \
            apps/desktop/src/renderer/src/features/groups/GroupRoom.test.tsx
          python3 <<'PY'
          import hashlib, pathlib
          path = 'apps/desktop/src/renderer/src/features/groups/GroupRoom.test.tsx'
          expect = '32ef929f2b682940ce2ab0711b774f2456cbfd81'
          data = pathlib.Path(path).read_bytes()
          assert not data.startswith(b'$file:') and not data.startswith(b'@file:')
          dig = hashlib.sha1(b'blob %d\0' % len(data) + data).hexdigest()
          assert dig == expect, (dig, expect, len(data))
          print('ok', path, dig, len(data))
          PY
          rm -f .github/workflows/restore-group-minors-room-test.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'nothing to commit'
            exit 0
          fi
          git commit -m 'fix(groups): restore GroupRoom.test conversation minors blob'
          git push origin HEAD:${{ github.ref_name }}
