# trigger: 2026-10-01T10:19Z restore MessageList/Composer/MessageRow
name: restore-group-minors-ui
on:
  push:
    branches: [cursor/group-conversation-minors-c747]
    paths:
      - '.github/workflows/restore-group-minors-ui.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore UI files from known-good commit
        run: |
          set -euo pipefail
          GOOD=6a2eddaef7fafa03e6465f38bfcd1cc5e74f6570
          git checkout "$GOOD" -- \
            apps/desktop/src/renderer/src/features/groups/GroupMessageList.tsx \
            apps/desktop/src/renderer/src/features/groups/GroupComposer.tsx \
            apps/desktop/src/renderer/src/features/groups/GroupMessageRow.tsx
          python3 <<'PY'
          import hashlib, pathlib
          expect = {
            'apps/desktop/src/renderer/src/features/groups/GroupMessageList.tsx': 'aca12662c07dc605778fcfc38e95ea6d4ec1d239',
            'apps/desktop/src/renderer/src/features/groups/GroupComposer.tsx': '57efaa1d03058b5a5f93392bc2f543a574a323f5',
            'apps/desktop/src/renderer/src/features/groups/GroupMessageRow.tsx': '13407eac2a2cf26b28e5492f7fbab5c7254f92df',
          }
          for path, blob in expect.items():
            data = pathlib.Path(path).read_bytes()
            assert not data.startswith(b'$file:') and not data.startswith(b'@file:')
            assert b'PLACEHOLDER' not in data[:200]
            dig = hashlib.sha1(b'blob %d\0' % len(data) + data).hexdigest()
            assert dig == blob, (path, dig, blob)
            print('ok', path, dig)
          PY
          rm -rf internal/_push/group-minors
          rm -f .github/workflows/restore-group-minors-ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'nothing to commit'
            exit 0
          fi
          git commit -m 'fix(groups): restore MessageList/Composer/MessageRow from 6a2edda'
          git push origin HEAD:${{ github.ref_name }}
