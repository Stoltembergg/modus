name: restore-pr113-group-runtime
# Restores group-runtime.ts from known-good tip 8bbe652 (pre-LOAD_FROM_FILE corruption in 61d1d0b).
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/restore-pr113-group-runtime.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/cursor/group-execution-linking-c747'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/group-execution-linking-c747
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore group-runtime.ts from 8bbe652
        run: |
          set -euo pipefail
          f=apps/desktop/src/main/groups/group-runtime.ts
          if grep -q 'export class GroupRuntime' "$f" && grep -q 'startsChain || chainId === undefined' "$f"; then
            echo already restored
            exit 0
          fi
          git checkout 8bbe652bead5690309ed91ac8a470b5b4cd3b117 -- "$f"
          test -s "$f"
          grep -q 'export class GroupRuntime' "$f"
          grep -q 'startsChain || chainId === undefined' "$f"
          ! grep -q 'LOAD_FROM_FILE' "$f"
          ! grep -q 'PLACEHOLDER' "$f"
          python3 -c "import pathlib; b=pathlib.Path('$f').read_bytes(); assert len(b)>40000, len(b)"
          git config user.email "stoltembergg@gmail.com"
          git config user.name "Gabriel"
          git add "$f"
          git commit -m "fix(groups): restore group-runtime.ts after LOAD_FROM_FILE corruption"
          git push origin HEAD:cursor/group-execution-linking-c747
