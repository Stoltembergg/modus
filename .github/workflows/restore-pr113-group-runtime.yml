name: restore-pr113-group-runtime
on:
  push:
    paths:
      - .github/workflows/restore-pr113-group-runtime.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: restore-pr113-group-runtime
  cancel-in-progress: true
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/group-execution-linking-c747
          fetch-depth: 0
      - name: Restore group-runtime.ts
        run: |
          set -euo pipefail
          GOOD=90e34988c96296f16c121f238e94c743f32e2087
          TARGET=apps/desktop/src/main/groups/group-runtime.ts
          git show "$GOOD:$TARGET" > "$TARGET"
          bytes=$(wc -c < "$TARGET")
          echo "restored_bytes=$bytes"
          test "$bytes" -gt 40000
          ! grep -q '^LOAD_FROM_FILE$' "$TARGET"
          grep -q 'class GroupRuntime' "$TARGET"
          grep -q 'startsChain || chainId === undefined' "$TARGET"
          sha256sum "$TARGET"
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/main/groups/group-runtime.ts
          if git diff --cached --quiet; then
            echo "already_restored"
            exit 0
          fi
          git commit -m "fix(groups): restore group-runtime.ts wiped by LOAD_FROM_FILE stub"
          git push origin HEAD:cursor/group-execution-linking-c747
