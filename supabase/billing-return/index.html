<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Modus billing</title>
  </head>
  <body style="font-family: system-ui; padding: 3rem; text-align: center">
    <!--
      Static fallback page for Stripe Checkout / Customer Portal returns (B3).
      Host it at the https URL set as BILLING_RETURN_URL for the Edge Functions.
      Stripe redirects here with ?modus_billing=success|cancel|portal; the page
      only forwards that one allow-listed value to the desktop app. No session
      id, customer id or token is ever read or forwarded.
    -->
    <h1 id="title">Return to Modus</h1>
    <p id="message">You can close this tab and go back to the app.</p>
    <p><a id="open" href="modus://billing/return">Open Modus</a></p>
    <script>
      (() => {
        const allowed = { success: "Payment received", cancel: "Checkout cancelled", portal: "Billing updated" };
        const status = new URLSearchParams(window.location.search).get("modus_billing");
        if (!status || !Object.hasOwn(allowed, status)) return;
        const target = `modus://billing/return?status=${status}`;
        document.getElementById("title").textContent = allowed[status];
        document.getElementById("open").setAttribute("href", target);
        window.location.replace(target);
      })();
    </script>
  </body>
</html>
